version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directories: [/relay, /protocol/conformance]
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/relay, /web]
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /warroom
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      warroom-go:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /warroom/islands
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      warroom-npm:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /warroom/fly
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      warroom-docker:
        patterns: ["*"]
