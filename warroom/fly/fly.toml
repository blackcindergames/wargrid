app = 'wargrid-lab-test'
primary_region = 'fra'

[env]
  WARROOM_PICKS = '/data/picks.json'

[mounts]
  source = 'decision_picks'
  destination = '/data'

[http_service]
  internal_port = 8780
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '5s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
