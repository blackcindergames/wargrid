# yaml-language-server: $schema=../step.schema.json
kind: pictures
question: 'Build queue: how many entries show?'
why: >-
  Take A, your capped list; your mock and what changed sit under A. What you pay: cancelling the newest
  entries takes two clicks from 6 queued, the expanded list is taller than today's, and it is about half
  a day for a slab P2.3b replaces with nine slots. If hidden entries bother you more than a busy list,
  pick B: same height, one click each, less code. A cancel refunds the full price (`$800` for either tank)
  and only the entry in production loses its progress (production.gd:15-21 @ 7b22ebc); a queued entry
  loses only its place. In A, B and D a click anywhere on a row cancels, as a click on a Zero Hour or
  P2.3b queue slot does, so the row's tooltip says it: `Cancel: refunds $800`.
look: >-
  Where to look: the bottom right, a China Vehicle Factory with a full queue of nine (the worst case),
  with the playtest checklist, note form and F3 open. Under A, the same list expanded. The whole screen
  (click the picture; on a phone: View, Whole screen) prints the slab's measured height at the top left.
rec: A
recWhy: >-
  your look with fewer things on screen; the cost is two clicks to cancel late entries from 6 queued.
neutral: None of these
crop: {x: 840, y: 240, w: 440, h: 480}
phoneCrop: {x: 840, y: 300, w: 440, h: 420}
ref:
  label: 'Today: nine Cancel rows, slab 408 px'
  render: {state: chips}
notesLabel: Challenger
options:
  A:
    name: Capped list with `Show N more queued` (the owner's mock, adapted)
    render: {state: queue-a}
    sees: >-
      Under Produce: a header line, `QUEUE` left (muted caps) and `8 waiting` right (muted, hidden at
      0). Then full-width rows, 32 high, square, on `btn`: unit name left, a muted × right; no `Cancel`
      word and no `1.` numbering. The row in production also shows `42 %` and a 2 px own-colour line on
      a dark track along its bottom. Clicking anywhere on a row cancels it and refunds the price; hover
      is the kind-row hover, brightens the × and shows the tooltip `Cancel: refunds $800`. Up to 5 entries
      all show. From 6, the list shows the one in production plus 3 next, then a full-width row `Show
      N more queued` with a drawn down chevron (a full queue reads `Show 5 more queued`). A click opens
      all nine plus `Show fewer`; it closes again when the selection changes or the queue drops to 5.
      Worst case at 1280x720: 282 px collapsed (today 408), 462 px while expanded.
    notes: >-
      The owner's look, and the only option that shows fewer things. Costs: the last-queued entries, the
      likeliest cancel targets, take two clicks at 6 or more; the expanded state is 54 px taller than
      today and becomes SL2's worst case (checklist cap 162 px); about half a day of builder time for
      a slab P2.3b replaces. Numbering is dropped because `1.` under the `1: Rotary Gun Tank $800` button
      reads as a key.
    changes: >-
      Changed from your mock: header `QUEUE` (the first row is already in production); no `1.` numbers
      (they read as the `1:` build key); production plus 3 next, so a full queue reads `Show 5 more queued`;
      the chevron drawn (Public Sans has no glyph); the progress line on a dark track (red or purple fail
      3:1 on the button).
    extra:
    - label: Your mock (local, not committed)
      img: docs/images/hud-v5/source/owner-mocks/queue.png
      local: true
    - label: A expanded, after a click on `Show 5 more queued` (462 px)
      render: {state: queue-a-open}
  B:
    name: Two columns, all nine always visible
    render: {state: queue-b}
    sees: >-
      The same header. The entry in production is one full-width row (name, `42 %`, progress line, ×).
      The up to 8 waiting entries are half-width tiles in two columns (name plus ×), read left to right,
      then down. No toggle, nothing hidden; every entry cancels with one click and refunds its price,
      tooltip `Cancel: refunds $800` as in A. Worst case 282 px, constant.
    notes: >-
      Same height saving as A collapsed with no hidden state, no reset rule and less code, and the helper
      surfaces never jump. But nine names stay on screen, which is what the owner asked to reduce, and
      the tile grid can read as a command card it is not.
  C:
    name: Slot row now (Zero Hour's and P2.3b's form)
    render: {state: queue-c}
    sees: >-
      The same header, then one row of nine 36 x 36 slots. A filled slot is a `btn` square showing the
      build key of its unit (`1 2 2 1 ...`, matching the `1: Rotary Gun Tank` buttons above); empty slots
      are dark wells. The first slot carries the progress bar. Clicking a slot cancels it. Worst case
      about 142 px, constant.
    notes: >-
      Closest to Zero Hour (nine icon slots, click cancels, clock on the first) and to P2.3b's decided
      queue, and by far the lowest slab. But digits instead of names are cryptic without glyphs, and it
      overrides 'no queue row until P2.3b' (user, 2026-11-17), pulling P2.3b work into this package.
  D:
    name: Keep nine rows, shorter words only
    render: {state: queue-d}
    sees: >-
      Today's nine full-width rows, relabelled to name plus × (the first with `42 %` and the progress
      line), under the `QUEUE` header; a click anywhere on a row cancels and refunds, tooltip `Cancel:
      refunds $800` as in A. Nothing hidden, nothing new to learn. Worst case stays about 408 px (426
      with the header).
    notes: >-
      Near-zero cost and it waits for P2.3b's slot row, but it does not answer the complaint: a full queue
      still fills more than half the screen height and squeezes the playtest checklist to about 200 px.
