# yaml-language-server: $schema=../step.schema.json
kind: pictures
question: How many chips before the rest fold into `+N`?
why: >-
  A mid-game China base has about five chips; late games can have more than ten. The fold starts at the
  left end, the front of the order, so Headquarters and Supply Depots hide first and the Vehicle Factories
  stay. The pointer on `+N` lists the hidden ones (N to "more"). Drawn with eleven chips: Headquarters,
  Supply Depot, four Barracks, five Vehicle Factories.
look: 'The left end of the strip: how many chips stay, and the `+N` chip.'
crop: {x: 0, y: 0, w: 1280, h: 240}
controls:
  state: [many, more]
rec: B
recWhy: >-
  eight covers a normal base without folding and keeps the strip at a third of the top edge at 1280. A lets
  a late base fill the top edge up to POWER, over the map where attacks come from. C folds every Barracks
  of a late base.
neutral: None of these
options:
  A:
    name: Every chip that fits
    render: {params: {cap: all}}
    sees: All eleven chips; `+N` appears only when the strip would reach the power slab.
    notes: Nothing hidden until the top edge is full.
  B:
    name: Eight, then `+N`
    render: {params: {cap: 8}}
    sees: '`+3` at the left end (Headquarters, Supply Depot, the first Barracks), then eight chips.'
    notes: A normal base fits; a late base hides its Headquarters and Supply Depot first.
  C:
    name: Five, then `+N`
    render: {params: {cap: 5}}
    sees: '`+6` at the left end (Headquarters, Supply Depot, all four Barracks), then the five factories.'
    notes: Smallest strip; only the factories stay in a late base.
