question: Keep a finished entry held and muted under your pointer?
why: >-
  P2.3b: when the unit under your pointer finishes, its queue tile stays, muted and without cancel,
  until the pointer leaves, so a click never lands on the next unit that slid into its place. The queue
  follow-up carries the same rule to the NOW PRODUCING row, drawn here: `Done` over a full muted bar, no
  `×`, the counts already without it.
look: The NOW PRODUCING row, bottom left.
