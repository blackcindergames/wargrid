# yaml-language-server: $schema=../step.schema.json
kind: gallery
question: Ping button, armed state, ping mark and edge arrow as drawn
why: >-
  T2-8, after the owner's match. The Ping button (Menu chip look, key G) is a tab on the command card's
  top edge, 8 from the right, so it rides with the card's top (140 or 204 high) and sits on the screen's
  bottom edge when no card shows; armed it takes the armed look (`panel2`, 2 px cyan frame), the pointer
  is the crosshair and a muted line says what the next click does. The mark is a flat ring in `ally`
  (#69ceaa) with a dark under-stroke, as the crosshair has (art direction §11), pulsing twice and fading
  over its last 5 s of 30. A ping off screen shows a notched `ally` chevron with a dark stroke, 8 in from
  the edge (clear of the 3 px edge-scroll band), never under the dock; a click on it jumps there.
