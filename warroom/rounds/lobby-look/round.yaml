# yaml-language-server: $schema=../round.schema.json
closed: 2026-11-26
title: 'P20 Lobby look: remove control, invite code box, Join game'
intro: >-
  This round blocks P20's look pass. Every picture is drawn in the navy look decided after the first
  bot match (design answers, "Lobby look after the first bot match", user, 2026-11-26): the colours
  and density of the lobby round's pictures, no text under 12 px, no faction emblems. Decided, not
  asked: Join leaves the sidebar and becomes the third mode (Skirmish, Host game, Join game); one
  press, "Copy invite code", opens the room, locks map, teams and bots and copies the code, with
  "Map and bots are fixed once you have the code." beside the button before the press; after it the
  code box takes the shape of your joined box (muted "Invite code", bold code, a Copy code segment)
  and stays after your friend joined; an X replaces the bot row's ••• menu (one click, no confirm,
  tooltip "Remove bot"); while hosting with a code or joined, the other mode buttons are greyed with
  the tooltip "Stop hosting first" or "Leave first"; every row reserves the same action column, so the faction dropdowns line
  up (the measurement table checks it); the count line names the limit when + Add enemy bot is
  greyed, with the same text as the button's tooltip. Asked here: step 1 the X's look (N flips rest,
  hover, pressed, keyboard focus); step 2 the code box (N: before the press, Copied, later, friend
  in); step 3 where Join game takes the code (N: empty, from a link, connecting, two errors,
  joined).
  Each step changes one thing and draws the rest as Claude recommends. Every picture is on Broken
  Crown at 1280 x 720; S switches to 1280 x 800 and 1920 x 1080 (the UI scales from 720 as the game
  does). A neutral answer records no winner, and the build waits for your note. Source:
  docs/images/lobby-look-round/.
steps: [remove, invite-box, join]
render:
  page: docs/images/lobby-look-round/lobby-look.html
  w: 1280
  h: 720
  hash: view={state}
  pass:
    size: size
controls:
  size: [1280x720, 1280x800, 1920x1080]
  fit: true
