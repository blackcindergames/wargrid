kind: text
question: 'Advisory: how should tracked rows say what they measure?'
why: >-
  Stress rows run far more units than a real match (300 to 400); headroom rows are a real 3v3 team match
  measured on this Mac, the closest Mac stand-in for the goal. The tracked table's intro explains both.
rec: C
recWhy: two short words the intro defines once; "headroom" is the word D1 used.
neutral: Keep the built text
card:
  title: Tracked row names
  lines:
  - null
options:
  A:
    name: Stress and real 3v3
    text: 'Combat, huge battles (stress) · 3v3 match, simulation (real 3v3)'
    notes: Says what the goal rows are; repeats "3v3" in the name.
  B:
    name: Stress test and on this Mac
    text: 'Combat, huge battles (stress test) · 3v3 match, simulation (on this Mac)'
    notes: Longer; "on this Mac" fits every row, not only these.
  C:
    name: Stress and headroom (as built)
    text: 'Combat, huge battles (stress) · 3v3 match, simulation (headroom)'
    notes: Shortest; needs the intro to say what headroom means.
