# yaml-language-server: $schema=../step.schema.json
kind: text
question: 'Advisory: which headline for the checked table?'
why: >-
  Today's headline counts every row. With the red rows moved to the tracked table, "Nothing over budget"
  alone would read as if the whole game fits the low-end limit.
rec: B
recWhy: names what was checked in a few words; the tracked table under it says the rest.
neutral: Keep the built text
card:
  title: README speed block
  lines:
  - null
options:
  A:
    name: Count only
    text: '**Nothing over budget**'
    notes: Today's words; reads as if every area fits.
  B:
    name: Names the checked table (as built)
    text: '**Checked against the limit: nothing over budget**'
    notes: Says it covers only the checked rows; the tracked table follows.
  C:
    name: Names both tables
    text: '**Nothing over budget in the 7 checked areas; 8 more are tracked below**'
    notes: Longest; says up front that tracked rows exist.
