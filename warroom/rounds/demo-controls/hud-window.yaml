kind: pictures
question: Does the slab hold at every window size and on every backdrop?
why: >-
  A controls step on the HUD states page: S window size, F fit or true 100 %, G ground, Shift+G game-world
  backdrop, H HUD layer, O owner colour (Shift+O Neon), Shift+C colour vision, M the marker, K the numbers.
  Every control is also a button above the picture (on a phone: View).
look: >-
  Where to look: the bottom right slab, ringed by the marker. 3440 x 1440 is the 1720 x 720 layout at
  scale 2; 1920 x 1080 is 1280 x 720 at 1.5.
rec: A
recWhy: demo only; any answer is fine.
neutral: No difference
