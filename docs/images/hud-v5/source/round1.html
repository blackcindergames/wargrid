<!doctype html>
<meta charset="utf-8">
<title>Wargrid HUD v5, round 1</title>
<style>
@font-face{font-family:"Public Sans";font-weight:400;src:url(../../../../game/fonts/PublicSans-Regular.ttf) format("truetype")}
@font-face{font-family:"Public Sans";font-weight:600;src:url(../../../../game/fonts/PublicSans-SemiBold.ttf) format("truetype")}
@font-face{font-family:"Public Sans";font-weight:700;src:url(../../../../game/fonts/PublicSans-Bold.ttf) format("truetype")}
@font-face{font-family:"Public Sans";font-weight:800;src:url(../../../../game/fonts/PublicSans-ExtraBold.ttf) format("truetype")}
body{margin:0;background:#0a0f14;color:#dfe7ec;font:15px/1.45 "Helvetica Neue",Helvetica,Arial,sans-serif}
#err{position:fixed;left:0;right:0;top:0;z-index:99;background:#b3261e;color:#fff;font:600 14px ui-monospace,Menlo,monospace;padding:8px 14px;white-space:pre-wrap}
#err:empty{display:none}
#app{max-width:1360px;margin:0 auto;padding:18px 24px 60px}
#app.final{max-width:none}
[hidden]{display:none!important}
.top .n{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#60e5ed;font-weight:700}
.top h2{margin:2px 0 4px;font-size:24px}
.top p{margin:0 0 12px;color:#93a5b0;max-width:900px}
.top p.look{color:#f7c871}
.top p.rec{color:#93a5b0;min-height:1em}
.top p.rec .fail{color:#f7c871;font-weight:700}
.hud .cur{position:absolute;width:16px;height:22px;pointer-events:none;z-index:6}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar button{font:inherit;font-weight:700;color:#93a5b0;background:#16212a;border:0;padding:8px 12px;cursor:pointer}
.bar button.on{color:#08131c;background:#60e5ed}
.bar button:disabled{opacity:.4;cursor:default}
.bar .gap{margin-left:auto}
.bar .v4tag{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#08131c;background:#93a5b0;padding:2px 8px}
kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid currentColor;padding:1px 5px;opacity:.7;margin:0 4px}
.stagewrap{width:min(100%,calc((100vh - 380px)*var(--ar)));min-width:640px;margin:0 auto}
.stagewrap.full{width:var(--w);min-width:0;margin:0}
.under{display:grid;grid-template-columns:1fr 380px;gap:24px;margin-top:14px}
.under p{margin:6px 0 0;color:#b9c6ce}
.under p.agent{color:#93a5b0;font-size:13px}
.cp{margin-left:10px;background:#f7c871;color:#1a1408;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px}
textarea{width:100%;box-sizing:border-box;height:56px;background:#16212a;color:inherit;border:1px solid #2e3f4b;font:inherit;padding:8px}
.act button{font:inherit;border:0;cursor:pointer;margin-top:8px;padding:12px 22px;background:#16212a;color:#93a5b0;font-weight:700}
.act #pick{background:#f7c871;color:#1a1408;font-weight:800;font-size:16px}
.cov,.ctr{border-collapse:collapse;margin-top:14px;font-size:13px}
.cov caption,.ctr caption{text-align:left;color:#93a5b0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding-bottom:4px}
.cov th,.cov td,.ctr th,.ctr td{padding:3px 10px;text-align:right;border-top:1px solid #2e3f4b}
.cov th,.ctr th{color:#93a5b0;font-weight:600}
.cov th:first-child,.ctr th:first-child,.ctr td.l{text-align:left}
.cov td.hl{background:#60e5ed;color:#08131c;font-weight:800}
.cov td,.cov th{white-space:nowrap}
.ctr{margin:0 0 28px}
.ctr td.fail{color:#ffb4ab;font-weight:800}
.sw{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:6px}
.tables{display:flex;flex-wrap:wrap;gap:0 40px;align-items:flex-start}
.notes{color:#b9c6ce;max-width:1000px;margin:0 0 28px;padding-left:20px}
.notes li{margin:2px 0}
h3.sec{margin:0 0 8px;font-size:18px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;align-items:start}
.pairs figure{margin:0}
.pairs figcaption{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#93a5b0;margin-bottom:6px}
.state h3{margin:0 0 8px;font-size:18px}
.state{margin-bottom:28px}

.fit{position:relative;overflow:hidden;background:#000;aspect-ratio:var(--ar)}
.stage{position:absolute;left:0;top:0;overflow:hidden;background:#a88e5c}
.fit .stage{transform:scale(var(--s));transform-origin:0 0}
.world{position:absolute;left:0;top:0;display:block}

.hud{position:absolute;left:0;top:0;transform-origin:0 0;transform:scale(var(--k));color:var(--text);font:13px/1.2 var(--ff);user-select:none;font-variant-numeric:tabular-nums}
.hud *{box-sizing:border-box}
.hud>*{position:absolute}
.hud .slabbg,.hud .strip,.hud .alert,.hud .tc,.hud .refuse{border:0 solid var(--line)}
.hud .slabbg,.hud .strip,.hud .alert,.hud .refuse{background:var(--bg)}
.hud .lab{font-weight:700;font-size:12px;line-height:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.hud .muted{color:var(--muted);font-size:12px;line-height:14px;font-weight:400;white-space:nowrap}
.hud .amb{color:var(--amber)}
.hud .num{font-size:13px;font-weight:700;line-height:16px}
.hud .k{display:inline-block;flex:none;min-width:18px;height:18px;padding:0 4px;background:var(--well);color:var(--muted);font-weight:700;font-size:12px;line-height:18px;text-align:center;border-radius:0}
.hud .gl{flex:none;display:block;opacity:.85;color:var(--text)}

.hud .strip{display:flex;align-items:center;gap:24px;height:32px;padding:0 7px;width:max-content}
.hud .strip.ledge{padding-left:8px}
.hud .g{display:flex;align-items:center;gap:12px}
.hud .g.wide{gap:24px}
.hud .stat{display:flex;align-items:center;gap:8px;white-space:nowrap}
.hud .stat b{font-size:13px;font-weight:700}
.hud .stat.cr b{font-size:16px}
.hud .stat .arr{color:var(--muted);font-weight:400}
.hud .sep{width:1px;height:16px;background:var(--line);flex:none}
.hud .chip{display:flex;align-items:center;gap:8px;height:24px;padding:0 8px;background:var(--btn);border-radius:var(--r);white-space:nowrap;font-size:13px;font-weight:600}
.hud .pb{width:40px;height:4px;background:var(--well);flex:none}
.hud .pb i{display:block;height:100%;background:var(--you)}
.hud .alert{display:flex;align-items:center;gap:8px;height:28px;padding:0 7px;white-space:nowrap;font-weight:600}
.hud .sq{width:8px;height:8px;background:var(--amber);flex:none}
.hud .tr{display:flex;gap:8px}
.hud .tr>*{position:static}
.hud .tc{display:flex;align-items:center;gap:8px;height:32px;padding:0 7px;font-size:13px;font-weight:600;background:var(--btn);border-radius:var(--r);white-space:nowrap}
.hud .refuse{display:flex;align-items:center;gap:8px;height:28px;padding:0 7px;font-size:13px;font-weight:600;line-height:16px;white-space:nowrap}

.hud .pn{display:flex;flex-direction:column;gap:8px}
.hud .mini svg{display:block}
.hud .hd{display:flex;align-items:center;gap:8px;height:18px;line-height:14px;font-weight:700;font-size:14px;white-space:nowrap}
.hud .hd .x{color:var(--muted);font-size:13px;font-weight:600}
.hud .hd.split{justify-content:space-between}
.hud .id{display:flex;gap:8px;align-items:flex-start}
.hud .id>div{flex:1;min-width:0}
.hud .nr{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;min-height:14px}
.hud .nm{font-weight:700;font-size:14px;line-height:14px;white-space:nowrap}
.hud .hr{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--muted);white-space:nowrap}
.hud .hp{display:block;background:var(--well);flex:none}
.hud .hp b{display:block;height:100%}
.hud .kv{display:flex;align-items:center;gap:8px;white-space:nowrap}
.hud .kv .lab{width:112px}
.hud .foot{display:flex;align-items:center;justify-content:space-between}
.hud .cmd{display:flex;align-items:center;gap:8px;flex:none;width:122px;height:32px;padding:0 8px;font-size:13px;font-weight:600;white-space:nowrap}
.hud .cmd .grow{flex:1}
.hud .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.hud .krow{display:flex;align-items:center;gap:4px;height:26px;padding:0 8px 4px;overflow:hidden}
.hud .krow .kn{flex:1;font-size:13px;font-weight:600;line-height:16px;white-space:nowrap}
.hud .krow b{width:28px;text-align:right}
.hud .krow .hp{position:absolute;left:0;right:0;bottom:0;width:auto!important;height:3px!important}
.hud .qrow{display:flex;align-items:center;gap:8px;white-space:nowrap}
.hud .slot{width:36px;height:36px;display:grid;place-items:center;overflow:hidden;font-weight:700;font-size:13px}
.hud .slot.empty{background:#0f1820;box-shadow:inset 0 0 0 1px #223241;border-radius:var(--r)}
.hud .slots{display:flex;gap:4px}
.hud .qp{position:absolute;left:0;bottom:0;height:4px;background:var(--you)}

.hud .lattice{display:grid;gap:4px}
.hud .card .qrow{margin-top:8px}
.hud .prow{display:flex;gap:4px}
.hud .well{display:block;background:#0f1820;border-radius:var(--r)}
.hud .cell{display:block;padding:4px 8px}
.hud .cell.two{width:100px;height:60px}
.hud .cell.one{width:148px;height:40px}
.hud .cell .r1{display:flex;align-items:center;gap:4px}
.hud .cell .r1>.cost,.hud .cell .r1>.nm1{flex:1}
.hud .cell.cmd .r1{flex-direction:row-reverse;justify-content:space-between}
.hud .cell.two .r1{height:20px}
.hud .cell.one .r1{height:18px}
.hud .cell .nm2{display:block;margin-top:4px;font-size:12px;font-weight:600;line-height:14px}
.hud .cell .nm1{font-size:12px;font-weight:600;line-height:18px;white-space:nowrap}
.hud .cell .cost{display:block;line-height:14px}
.hud .cell.fade{opacity:.45}
.hud .cell.quiet{background:var(--quiet)}
.hud .cell.quiet .nm2,.hud .cell.quiet .nm1,.hud .cell.quiet .cost:not(.amb),.hud .cell.quiet .gl{color:var(--muted)}
.hud .cell .cn{font-size:13px;font-weight:600;white-space:nowrap}
.hud .cell.two .cn{display:block;margin-top:4px;line-height:28px}
.hud .cell.one.cmd{display:flex;align-items:center;gap:8px}
.hud .cell.one.cmd .k{position:absolute;top:4px;right:8px}
.hud .cell .cn .muted{font-size:13px}

.hud .b{background:var(--btn);border-radius:var(--r);position:relative;cursor:pointer}
.hud .b.on{background:var(--panel2);box-shadow:inset 0 0 0 2px var(--sel)}
.hud .cnt{position:absolute;right:4px;bottom:4px;height:14px;padding:0 4px;background:var(--well);font-size:13px;font-weight:700;line-height:14px;border-radius:0}
.hud .arrow{display:flex;align-items:center;justify-content:center;width:28px;height:28px;background:var(--bg);border:0 solid var(--line)}
.hud .ccard{width:248px;padding:7px;background:var(--bg);border:1px solid var(--line);font-size:13px;pointer-events:none;z-index:5}
.hud .ccard>div{height:20px;line-height:20px;white-space:nowrap}
.hud .ccard b{font-weight:600}
.hud .cl{color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
</style>
<div id="err"></div>
<div id="app"></div>
<script src="glyphs.js"></script>
<script src="glyphs3.js"></script>
<script>
addEventListener('error', e => { err.textContent += `${e.message} (${(e.filename || '').split('/').pop()}:${e.lineno})\n`; });
addEventListener('unhandledrejection', e => { err.textContent += `${e.reason}\n`; });

const SIZES = {'1920x1080': {w: 1920, h: 1080, k: 1.5}, '1280x800': {w: 1280, h: 800, k: 1}, '1280x720': {w: 1280, h: 720, k: 1}};
const SIZE_KEYS = Object.keys(SIZES);
const SIZE_ALIAS = {1920: '1920x1080', 1280: '1280x800', 720: '1280x720'};
const sizeKey = x => SIZES[x] ? x : SIZE_ALIAS[x] || '1920x1080';
const sizeLabel = x => x.replace('x', ' x ');
const STATES = ['none', 'one', 'many', 'factory', 'plant', 'full', 'builder', 'build', 'place', 'blocked', 'enemy', 'pile', 'site'];
const STATE_KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', ',', '.', '-'];
const STATE_LABEL = {none: 'Nothing selected', one: 'One unit', many: '120 units', factory: 'Factory', plant: 'Power Plant', full: 'Queue full', builder: 'Bulldozer', build: 'Build menu',
  place: 'Placement', blocked: 'Blocked placement', enemy: 'Enemy unit', pile: 'Supply pile', site: 'Construction'};
const TIER_LABEL = {full: 'Full', core: 'Core (early package)'};
const FONT = "'Public Sans', Arial, sans-serif";
const DOCK = 168, SEL_W = 408, PIN_W = 220, GAP = 8, STRIP = 32;
const CELL_PAD = 8;
const CELL = {two: {w: 100, h: 60}, one: {w: 148, h: 40}};
const ONE_NAME_W = CELL.one.w - 2 * CELL_PAD - 18 - 4;
const TWO_NAME_W = CELL.two.w - 2 * CELL_PAD;
const cardWidth = o => 4 + 8 + 4 * CELL[o.cell].w + 3 * 4 + 8;
const LATTICE = ['QWER', 'ASDF', 'ZXCV'].map(r => [...r]);
const REFUSAL = 'Cannot build here';

const luminance = hex => {
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(c => c <= .03928 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4);
  return .2126 * r + .7152 * g + .0722 * b;
};
const contrast = (a, b) => { const [hi, lo] = [luminance(a), luminance(b)].sort((x, y) => y - x); return (hi + .05) / (lo + .05); };
const mix = (a, b, t) => '#' + [1, 3, 5].map(i => Math.round(parseInt(a.slice(i, i + 2), 16) * (1 - t) + parseInt(b.slice(i, i + 2), 16) * t).toString(16).padStart(2, '0')).join('');
const BG = '#121c24';
function lifted(hex) {
  for (let i = 0; i <= 20; i++) { const c = mix(hex, '#ffffff', i * .05); if (contrast(c, BG) >= 3) return c; }
  return '#ffffff';
}
const OWNERS = [['Blue (you)', '#44adf4'], ['Red (enemy)', '#d54f3b'], ['Green', '#4fc389'], ['Gold', '#ecdc3c'], ['Orange', '#e08522'], ['Purple', '#9249ac'], ['Teal', '#008d8d'], ['Pink', '#ffa5d4']];
const FLAT = {bg: BG, panel: '#1b2731', btn: '#223241', panel2: '#26384a', line: '#2e3f4b', edge: '#263842', well: '#0c141a', text: '#eef3f5', muted: '#93a5b0',
  sel: '#60e5ed', amber: '#f7c871', you: lifted(OWNERS[0][1]), enemy: lifted(OWNERS[1][1]), ally: '#69ceaa', quiet: '#16212a', r: '0'};
const HEALTH = ['#5cc85a', '#e0d060', '#d8453a'];
const GLYPH_KEY = {
  'Medium Tank': 'china_light_vehicle', 'Rotary Gun Tank': 'china_tank', 'Militia': 'china_rifle_infantry',
  'Anti-Tank Trooper': 'china_rocket_infantry', 'Supply Truck': 'china_collector', 'Bulldozer': 'china_builder',
  'Power Plant': 'china_power_plant', 'Supply Depot': 'china_supply_center', 'Barracks': 'china_barracks',
  'Vehicle Factory': 'china_factory', 'Rotary Gun Tower': 'china_defence', 'Headquarters': 'china_command_center'};
const COMMAND_GLYPHS = new Set(['attack_move', 'guard', 'stop', 'sell', 'build']);
const PAGE_GLYPH = {build: '<path d="M2 11H13V22H2Z"/><path d="M17 2H20V6H23V9H20V13H17V9H14V6H17Z"/>'};
const BASE = {credits: 4800, power: 8, avail: 10};
const DATA = {
  none: {...BASE, ring: true, alert: true}, one: {...BASE}, many: {...BASE, power: 11, offline: true, alert: true},
  factory: {...BASE, credits: 650, hover: 'Rotary Gun Tank'}, plant: {...BASE},
  full: {...BASE, hover: 'Medium Tank', queue: ['Medium Tank', 'Medium Tank', 'Rotary Gun Tank', 'Medium Tank', 'Rotary Gun Tank', 'Rotary Gun Tank', 'Medium Tank', 'Medium Tank', 'Rotary Gun Tank']},
  builder: {...BASE},
  build: {...BASE, credits: 2400, power: 0, avail: 0, early: true, hover: 'Supply Depot'},
  place: {...BASE, armed: 'Rotary Gun Tower'}, blocked: {...BASE, armed: 'Vehicle Factory', refuse: true},
  enemy: {...BASE}, pile: {...BASE}, site: {...BASE}};
const MENU_OPEN = new Set(['build', 'place', 'blocked']);
const KINDS = [['Medium Tank', 36, 82], ['Rotary Gun Tank', 24, 64], ['Militia', 24, 91], ['Anti-Tank Trooper', 12, 45], ['Supply Truck', 12, 100], ['Bulldozer', 12, 100]];
const GROUPS = [[1, 36], [2, 24], [3, 12]];
const PRODUCING = [['Medium Tank', 42, 'Vehicle Factory'], ['Bulldozer', 60, 'Headquarters']];
const QUEUE = ['Medium Tank', 'Medium Tank', 'Rotary Gun Tank', 'Medium Tank'];
const FACTORY_KEY = {'Medium Tank': 'Q', 'Rotary Gun Tank': 'W'};
// [cost, seconds, power, prerequisite]: seconds are definition ticks / 30 (china.gd)
const CELLS = {'Medium Tank': [800, 10], 'Rotary Gun Tank': [800, 10], 'Power Plant': [1000, 10, {avail: 10}], 'Supply Depot': [1500, 10, {used: 1}, 'Power Plant'],
  'Barracks': [500, 10], 'Vehicle Factory': [2000, 15, {used: 1}, 'Supply Depot'], 'Rotary Gun Tower': [1200, 25, {used: 3}, 'Power Plant']};
const INCOME = 1350, SPEND = 1600;

const num = n => n.toLocaleString('en-US');
const px = n => `${n}px`;
const isCore = v => v.tier === 'core';
const queueOf = v => DATA[v.state].queue || QUEUE;
const isFull = v => queueOf(v).length >= 9;
const queued = (v, name) => queueOf(v).filter(n => n === name).length;

let glyphSet = [];
const loadGlyphs = () => { glyphSet = [PAGE_GLYPH, ...(typeof GLYPH3 !== 'undefined' ? [GLYPH3] : []), ...(typeof GLYPH !== 'undefined' ? [GLYPH] : [])]; };
const glyphFor = name => glyphSet.map(set => set[name]).find(Boolean);
function glyph(name, px) {
  const g = glyphFor(name), s = `width:${px}px;height:${px}px`;
  if (!g) return `<span class="gl" style="${s}"></span>`;
  const vb = COMMAND_GLYPHS.has(name) ? 24 : 48;
  return `<svg class="gl" viewBox="0 0 ${vb} ${vb}" style="${s}" fill="currentColor">${g}</svg>`;
}
const unitGlyph = (name, px) => glyph(GLYPH_KEY[name], px);
const hpColor = p => p > 66 ? HEALTH[0] : p > 33 ? HEALTH[1] : HEALTH[2];
const bar = (pct, w, h, color) => `<i class="hp" style="width:${w}px;height:${h}px"><b style="width:${pct}%;background:${color}"></b></i>`;
const hpBar = (pct, w, h) => bar(pct, w, h, hpColor(pct));
const key = k => `<span class="k">${k}</span>`;
const borders = (t, r, b, l) => `border-width:${[t, r, b, l].map(px).join(' ')}`;

function slab({left, width, height, edge, border, pad}) {
  const padding = pad.map((p, i) => px(p - border[i])).join(' ');
  return `left:${left}px;bottom:0;width:${width}px;${height ? `height:${height}px;` : ''}border-width:${border.map(px).join(' ')};padding:${padding};${edge ? `box-shadow:inset 4px 0 0 ${edge}` : ''}`;
}

function minimap(v, size) {
  const d = DATA[v.state], mid = size / 2;
  if (d.offline) {
    return `<svg width="${size}" height="${size}"><rect width="${size}" height="${size}" fill="#0c141a"/>
      <text x="${mid}" y="${mid - 4}" text-anchor="middle" fill="#93a5b0" font-size="12" font-weight="700" letter-spacing="1.44">RADAR OFFLINE</text>
      <text x="${mid}" y="${mid + 16}" text-anchor="middle" fill="#f7c871" font-size="12">Low power</text></svg>`;
  }
  // Allegiance by shape as well as hue: own square, enemy diamond, ally disc.
  const SHAPE = {
    own: (x, y) => `<rect x="${x}" y="${y}" width="5" height="5" fill="${FLAT.you}"/>`,
    enemy: (x, y) => `<path d="M${x + 3} ${y - 1} ${x + 7} ${y + 3} ${x + 3} ${y + 7} ${x - 1} ${y + 3}z" fill="${OWNERS[1][1]}"/>`,
    ally: (x, y) => `<circle cx="${x + 3}" cy="${y + 3}" r="3.5" fill="${FLAT.ally}"/>`};
  const dots = (pts, who) => pts.map(([x, y]) => SHAPE[who](x, y)).join('');
  return `<svg width="${size}" height="${size}"><rect width="${size}" height="${size}" fill="#2f352e"/>
    <rect x="86" y="14" width="40" height="30" fill="#252a24"/><rect x="20" y="58" width="30" height="40" fill="#252a24"/>
    ${dots([[18, 110], [24, 118], [32, 108], [26, 126], [38, 120], [14, 126], [36, 131]], 'own')}
    ${dots([[110, 26], [120, 34], [104, 36], [124, 20]], 'enemy')}${dots([[76, 70]], 'ally')}
    <rect x="9.5" y="92.5" width="56" height="42" fill="none" stroke="#fff"/>
    ${d.ring ? '<circle cx="50" cy="118" r="4" fill="none" stroke="#f7c871" stroke-width="2"/>' : ''}</svg>`;
}

function stat(label, value, extra = '', cls = '') {
  return `<span class="stat ${cls}"><span class="lab">${label}</span><b>${value}</b>${extra}</span>`;
}
const lowPower = '<span class="lab amb">Low power</span>';
const arrow = '<span class="arr">→</span>';
function creditsValue(d, armed) {
  return armed ? `${num(d.credits)} ${arrow} ${num(d.credits - CELLS[armed][0])}` : num(d.credits);

    textRects(box).forEach(t => { if (!inside(t, R(box))) out.push(`text cut: ${label(box)}`); });
  });
  hudEl.querySelectorAll('.b').forEach(b => {
    const chips = [...b.querySelectorAll('.k,.cnt,.gl')].filter(shown).map(R);

  });
  hudEl.querySelectorAll('.nm2').forEach(n => { if (n.offsetHeight > 28) out.push(`third line: ${label(n)}`); });
  hudEl.querySelectorAll('[data-cov]:not([data-id])').forEach(el => out.push(`covering rect without id: ${label(el)}`));
  all.filter(el => !(el instanceof SVGElement) || el.tagName === 'svg').forEach(el => out.push(...themeProblems(el)));
  const solid = [...hudEl.querySelectorAll('[data-cov],.ccard,.refuse')].filter(shown);
  solid.forEach((a, i) => solid.slice(i + 1).forEach(b => { if (hit(R(a), R(b))) out.push(`overlap: ${label(a)} / ${label(b)}`); }));
  const keys = [...hudEl.querySelectorAll('.k')].filter(shown).map(k => k.textContent);
  keys.filter((k, i) => keys.indexOf(k) !== i).forEach(k => out.push(`key twice: ${k}`));
  all.forEach(el => {
    const cs = getComputedStyle(el), paint = [cs.color, cs.backgroundColor, cs.boxShadow, cs.fill, cs.stroke].join(' ');
    const ownText = [...el.childNodes].some(n => n.nodeType === 3 && n.textContent.trim());
    if (paint.includes(CYAN) && !el.closest('.on')) out.push(`cyan off a selected control: ${label(el)}`);
    if (paint.includes(AMBER) && !el.closest('.amb,.sq,.arrow,.mini')) out.push(`amber outside its rules: ${label(el)}`);
    if (ownText && REDS.includes(cs.color)) out.push(`red text: ${label(el)}`);
    if (ownText && parseFloat(cs.fontSize) < 12) out.push(`text under 12 px: ${label(el)}`);
    if (ownText && !(el instanceof SVGElement)) { const r = textContrast(el, hudEl); if (r < 4.5) out.push(`contrast ${r.toFixed(1)} under 4.5: ${label(el)}`); }

}

  if (k === 'overall') post(k, null, e.target.value);
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || step >= STEPS.length || e.metaKey || e.ctrlKey) return;
  const k = e.key.toLowerCase(), s = STEPS[step];
  if (k === 'a' || k === 'arrowleft') show = 'A';
  else if (k === 'b' || k === 'arrowright') show = 'B';
  else if (STATE_KEYS.includes(k)) state = STATES[STATE_KEYS.indexOf(k)];
  else if (k === 'n') state = STATES[(STATES.indexOf(state) + 1) % STATES.length];
  else if (k === 's') size = SIZE_KEYS[(SIZE_KEYS.indexOf(size) + 1) % SIZE_KEYS.length];
  else if (k === 't' && !s.tier) tier = tier === 'full' ? 'core' : 'full';
  else if (k === 'f') full = !full;
  else if (k === 'enter') return choose();
  else return;
  render();
});
document.addEventListener('mouseover', e => {
  const hudEl = e.target.closest && e.target.closest('.hud');
  if (hudEl) updateCard(hudEl, e.target.closest('[data-cell]'));
});
document.addEventListener('mouseout', e => {
  const hudEl = e.target.closest && e.target.closest('.hud');
  if (hudEl && !(e.relatedTarget && hudEl.contains(e.relatedTarget))) updateCard(hudEl, null);
});
addEventListener('resize', fit);

function shot() {
  document.body.style.cssText = 'overflow:hidden;background:#000';
  app.style.cssText = 'max-width:none;padding:0';
  const scale = +(H.get('scale') || 1);
  app.innerHTML = `<div style="transform:scale(${scale});transform-origin:0 0">${stage(optsFor(-1, null), {state: H.get('shot'), size, tier})}</div>`;
  placeCards(app);
  fontsReady().then(() => { placeCards(app); audit(app.querySelector('.hud')).forEach(p => { err.textContent += `layout: ${p}\n`; }); });
}
const TYPE = [{role: 'panel title', size: 14, weight: 700}, {role: 'row, button and command names', size: 13, weight: 600},
  {role: 'cell names (two lines, line height 14)', size: 12, weight: 600}, {role: 'numbers', size: 13, weight: 700}, {role: 'credits value', size: 16, weight: 700},
  {role: 'labels (uppercase, letter-spacing .1em)', size: 12, weight: 700}, {role: 'hints', size: 12, weight: 400}, {role: 'key chips', size: 12, weight: 700}];
function nameChildren(hudEl) {
  [['.sel .krow', 'selection.row'], ['.sel .slot', 'selection.queue'], ['.card .slot', 'card.queue'], ['.pinned .slot', 'pinned.queue'], ['.pinned .cell', 'pinned.cell']]
    .forEach(([sel, id]) => hudEl.querySelectorAll(sel).forEach((el, i) => { el.dataset.id = `${id}.${i + 1}`; }));
}
const rectKind = el => el.matches('.cell,.well') ? 'cell' : el.matches('.krow') ? 'row' : el.matches('.slot') ? 'slot' : el.matches('.ccard') ? 'popup' : el.matches('.cmd') ? 'button' : 'slab';
function cellInfo(el) {
  const key = el.dataset.id.split('.').pop();
  if (el.matches('.well')) return {key, state: 'empty'};
  const chip = el.querySelector('.k').textContent, info = {text: el.dataset.cell || el.querySelector('.cn').firstChild.textContent.trim(), key};
  if (chip !== key) info.chip = chip;
  if (el.matches('.on')) return {...info, state: 'armed'};
  return el.dataset.reason ? {...info, state: 'blocked', reason: el.dataset.reason} : {...info, state: 'ready'};
}
const slotInfo = el => el.matches('.empty') ? {state: 'empty'} : {state: 'filled', text: el.textContent.trim() || el.dataset.item};
function fieldsOf(el) {
  if (el.matches('.card .cell,.card .well')) return cellInfo(el);
  if (el.matches('.slot')) return slotInfo(el);
  if (el.matches('.krow')) return {text: el.dataset.name, count: +el.dataset.count};
  return {};
}
const r2 = n => Math.round(n * 100) / 100;
function layoutRect(el, hudEl) {
  const hr = hudEl.getBoundingClientRect(), r = el.getBoundingClientRect(), sc = hudScale(hudEl);
  const out = {id: el.dataset.id, kind: rectKind(el), x: r2((r.left - hr.left) / sc), y: r2((r.top - hr.top) / sc), w: r2(r.width / sc), h: r2(r.height / sc)};
  if (el.hasAttribute('data-cov')) out.covers = true;
  return {...out, ...fieldsOf(el)};
}
function layoutScreen(o, v) {
  const pct = coverage(o, v), {w, h, k} = SIZES[v.size];
  probeStage(o, v);
  placeCards(probe);
  const hudEl = probe.querySelector('.hud');
  nameChildren(hudEl);
  const rects = [...hudEl.querySelectorAll('[data-id]')].filter(shown).map(el => layoutRect(el, hudEl));
  return {state: v.state, tier: v.tier, size: [w, h], k, coverage_pct: r2(pct), rects};
}
async function layoutPicks() {
  if (H.get('picks')) return picks;
  const saved = await fetch('picks.json').then(r => r.ok ? r.json() : {}, () => ({}));
  return Object.fromEntries(STEPS.filter(s => saved[s.key] && s[saved[s.key].pick]).map(s => [s.key, saved[s.key].pick]));
}
async function exportLayout() {
  await fontsReady();
  const chosen = await layoutPicks(), o = optsWith(chosen), screens = [];
  for (const st of STATES) for (const t of ['full', 'core']) for (const sz of SIZE_KEYS) screens.push(layoutScreen(o, {state: st, tier: t, size: sz}));
  probe.innerHTML = '';
  const doc = {meta: {picks: Object.fromEntries(STEPS.map(s => [s.key, {pick: chosen[s.key] || 'A (default)', value: o[s.key]}])), font: 'Public Sans', unit: 'HUD px, origin top left',
    scale: 'k = min(width / 1280, height / 720)', source: 'docs/images/hud-v5/source/round1.html'},
    tokens: Object.fromEntries(Object.entries(FLAT).filter(([k]) => k !== 'r')), type: TYPE, screens};
  const r = await fetch('/layout', {method: 'POST', body: JSON.stringify(doc)}).catch(() => null);
  app.textContent = r && r.status === 204 ? `Layout posted: ${screens.length} screens.` : 'Layout not posted: server not reachable.';
}
async function auditAll() {
  await fontsReady();
  const variants = [['defaults', {}], ...STEPS.map(s => [`${s.key}:B`, {[s.key]: 'B'}])], problems = [];
  let n = 0;
  for (const [name, chosen] of variants) {
    for (const st of STATES) for (const t of ['full', 'core']) for (const sz of SIZE_KEYS) {
      probeStage(optsWith(chosen), {state: st, size: sz, tier: t});
      placeCards(probe);
      audit(probe.querySelector('.hud')).forEach(p => problems.push(`${name} ${st} ${t} ${sz}: ${p}`));
      n++;
    }
  }
  probe.innerHTML = '';
  const fits = nameFit().map(f => `${f.name}: ${f.w.toFixed(1)} / word ${f.word.toFixed(1)} / ${f.lines} lines / two ${f.two ? 'fits' : 'MISS'} / one ${f.one ? 'fits' : 'MISS'}`);
  const covs = ['full', 'core'].flatMap(t => SIZE_KEYS.map(sz => `${t} ${sz}: ${STATES.map(st => `${st} ${coverage(DEFAULTS, {state: st, size: sz, tier: t}).toFixed(1)}`).join(', ')}`));
  const expected = problems.filter(p => p.startsWith('dim:B') && p.includes(': contrast ')).length;
  const text = `Audit done: ${n} screens, ${problems.length} problems (${expected} of them the expected contrast fails of dim:B)\n${problems.join('\n')}\n${fits.join('\n')}\n${covs.join('\n')}`;
  app.innerHTML = `<pre style="white-space:pre-wrap;font-size:12px">${text}</pre>`;
  // Headless screenshots fire before this finishes, so a local listener can collect the text instead.
  if (H.get('report')) fetch(`http://127.0.0.1:${+H.get('report')}/`, {method: 'POST', mode: 'no-cors', body: text});
}
document.body.insertAdjacentHTML('beforeend', '<div id="probe" style="position:absolute;left:-10000px;top:0;visibility:hidden"></div>');
if (H.has('audit')) { app.innerHTML = '<h2>Audit running…</h2>'; auditAll(); }
else if (H.has('layout')) { app.textContent = 'Building layout…'; exportLayout(); }
else if (H.has('shot')) shot();
else {
  render();
  // Coverage depends on text widths, so measure again once Public Sans is in.
  fontsReady().then(() => { Object.keys(covCache).forEach(k => delete covCache[k]); render(); });
}
</script>
