<!doctype html>
<meta charset="utf-8">
<title>Wargrid HUD v5, round 1</title>

<style>
body{margin:0;background:#0a0f14;color:#dfe7ec;font:15px/1.45 "Helvetica Neue",Helvetica,Arial,sans-serif}
#err{position:fixed;left:0;right:0;top:0;z-index:99;background:#b3261e;color:#fff;font:600 14px ui-monospace,Menlo,monospace;padding:8px 14px;white-space:pre-wrap}
#err:empty{display:none}
#app{max-width:1360px;margin:0 auto;padding:18px 24px 60px}
#app.final{max-width:none}
[hidden]{display:none!important}
.top .n{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#60e5ed;font-weight:700}
.top h2{margin:2px 0 4px;font-size:24px}
.top p{margin:0 0 12px;color:#93a5b0;max-width:900px}
.top p.look{color:#f7c871}
.top p.rec{color:#93a5b0;min-height:1em}
.top p.rec .fail{color:#f7c871;font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar button{font:inherit;font-weight:700;color:#93a5b0;background:#16212a;border:0;padding:8px 12px;cursor:pointer}
.bar button.on{color:#08131c;background:#60e5ed}
.bar button:disabled{opacity:.4;cursor:default}
.bar .gap{margin-left:auto}
.bar .v4tag{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#08131c;background:#93a5b0;padding:2px 8px}
kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid currentColor;padding:1px 5px;opacity:.7;margin:0 4px}
.stagewrap{width:min(100%,calc((100vh - 380px)*var(--ar)));min-width:640px;margin:0 auto}
.stagewrap.full{width:var(--w);min-width:0;margin:0}
.under{display:grid;grid-template-columns:1fr 380px;gap:24px;margin-top:14px}
.under p{margin:6px 0 0;color:#b9c6ce}

.cp{margin-left:10px;background:#f7c871;color:#1a1408;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px}
textarea{width:100%;box-sizing:border-box;height:56px;background:#16212a;color:inherit;border:1px solid #2e3f4b;font:inherit;padding:8px}
.act button{font:inherit;border:0;cursor:pointer;margin-top:8px;padding:12px 22px;background:#16212a;color:#93a5b0;font-weight:700}
.act #pick{background:#f7c871;color:#1a1408;font-weight:800;font-size:16px}
.cov,.ctr{border-collapse:collapse;margin-top:14px;font-size:13px}
.cov caption,.ctr caption{text-align:left;color:#93a5b0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding-bottom:4px}
.cov th,.cov td,.ctr th,.ctr td{padding:3px 10px;text-align:right;border-top:1px solid #2e3f4b}
.cov th,.ctr th{color:#93a5b0;font-weight:600}
.cov th:first-child,.ctr th:first-child,.ctr td.l{text-align:left}
.cov td.hl{background:#60e5ed;color:#08131c;font-weight:800}
.cov td,.cov th{white-space:nowrap}
.ctr{margin:0 0 28px}
.ctr td.fail{color:#ffb4ab;font-weight:800}
.sw{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:6px}

.world{position:absolute;left:0;top:0;display:block}

const {SIZES, STATES, NEW_STATES, FONT, BG, FLAT, OWNERS, HEALTH, CELL, CELL_PAD, contrast, mix, lifted, isCore, pinnedShown, hudScale, updateCard, placeCards, hud, shown} = HUDV5;
const SIZE_KEYS = Object.keys(SIZES);
const SIZE_ALIAS = {1920: '1920x1080', 1280: '1280x800', 720: '1280x720'};
const sizeKey = x => SIZES[x] ? x : SIZE_ALIAS[x] || '1920x1080';
const sizeLabel = x => x.replace('x', ' x ');
const STATE_KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', ',', '.', '-'];
const STATE_LABEL = {none: 'Nothing selected', one: 'One unit', many: '120 units', factory: 'Factory', plant: 'Power Plant', full: 'Queue full', builder: 'Bulldozer', build: 'Build menu',
  place: 'Placement', blocked: 'Blocked placement', enemy: 'Enemy unit', pile: 'Supply pile', site: 'Construction',
  'hover-cell': 'Hovered cell, empty queue', 'hover-tile': 'Hovered queue tile', press: 'Blocked press', builders: 'Two builders',
  'none-refuse': 'Nothing selected, Q pressed', 'two-cause': 'Two causes (FRC)'};
const TIER_LABEL = {full: 'Full', core: 'Core (early package)'};
const ONE_NAME_W = CELL.one.w - 2 * CELL_PAD - 18 - 4;
const TWO_NAME_W = CELL.two.w - 2 * CELL_PAD;
const WORLD = {full: 'factory', 'hover-cell': 'factory', 'hover-tile': 'factory', press: 'build', builders: 'builder', 'none-refuse': 'none', 'two-cause': 'build'};
const STAND_IN = {plant: 'factory'};
function noWorld(img) {
  img.remove();
  document.querySelectorAll('.v4tag').forEach(t => { t.hidden = false; });
}
function fallbackWorld(img, state) {
  if (!STAND_IN[state] || img.src.endsWith(`w-${STAND_IN[state]}.png`)) return noWorld(img);
  img.src = `worlds/w-${STAND_IN[state]}.png`;
}
function stage(o, v) {
  const {w, h} = SIZES[v.size];
  return `<div class="stage" style="width:${w}px;height:${h}px"><img class="world" style="width:${w}px" src="worlds/w-${WORLD[v.state] || v.state}.png" onerror="fallbackWorld(this,'${v.state}')">${hud(o, v)}</div>`;
}

const probeStage = (o, v) => { probe.innerHTML = `<div class="stage" style="width:${SIZES[v.size].w}px;height:${SIZES[v.size].h}px">${hud(o, v)}</div>`; };
const covCache = {};
function coverage(o, v) {
  const id = JSON.stringify([o, v]);
  if (id in covCache) return covCache[id];
  probeStage(o, v);
  let sum = 0;
  probe.querySelectorAll('[data-cov]').forEach(e => { const r = e.getBoundingClientRect(); sum += r.width * r.height; });
  probe.innerHTML = '';
  return covCache[id] = 100 * sum / (SIZES[v.size].w * SIZES[v.size].h);
}


const CYAN = 'rgb(96, 229, 237)', AMBER = 'rgb(247, 200, 113)', REDS = ['rgb(213, 79, 59)', 'rgb(216, 69, 58)', 'rgb(238, 113, 105)'];
const toHex = rgb => '#' + rgb.match(/\d+/g).slice(0, 3).map(n => (+n).toString(16).padStart(2, '0')).join('');
function textContrast(el, hudEl) {
  let bg = null, alpha = 1;
  for (let e = el; e && e !== hudEl; e = e.parentElement) {
    const cs = getComputedStyle(e);
    alpha *= +cs.opacity;
    if (!bg && cs.backgroundColor !== 'rgba(0, 0, 0, 0)') bg = toHex(cs.backgroundColor);
  }
  const back = bg || BG;
  return contrast(mix(toHex(getComputedStyle(el).color), BG, 1 - alpha), mix(back, BG, 1 - alpha));
}
const label = el => `${el.tagName.toLowerCase()}.${(el.getAttribute('class') || '').trim().replace(/\s+/g, '.')} "${(el.textContent || '').trim().slice(0, 24)}"`;
function textRects(box) {
  const walk = document.createTreeWalker(box, NodeFilter.SHOW_TEXT), out = [];
  for (let n = walk.nextNode(); n; n = walk.nextNode()) {
    if (!n.textContent.trim() || n.parentElement.closest('.k,.cnt')) continue;
    const r = document.createRange();
    r.selectNodeContents(n);
    out.push(...r.getClientRects());
  }
  return out;
}
const SPACE_SCALE = new Set([0, 4, 8, 12, 16, 24, 36]);
const SIDES = ['Top', 'Right', 'Bottom', 'Left'];
const onScale = n => SPACE_SCALE.has(Math.round(n * 100) / 100);
const blurOf = shadow => (shadow.match(/(-?[\d.]+)px/g) || []).map(parseFloat)[2] || 0;
// A side with no padding is a hairline, not spacing; otherwise the inset is border plus padding.
function insetOff(cs, side) {
  const pad = parseFloat(cs[`padding${side}`]);
  return pad && !onScale(pad + parseFloat(cs[`border${side}Width`])) ? pad + parseFloat(cs[`border${side}Width`]) : null;
}
function themeProblems(el) {
  const cs = getComputedStyle(el), out = [];
  SIDES.forEach(side => {
    const inset = insetOff(cs, side), m = parseFloat(cs[`margin${side}`]);
    if (inset !== null) out.push(`padding-${side.toLowerCase()} ${inset}`);
    if (!onScale(m)) out.push(`margin-${side.toLowerCase()} ${m}`);
  });
  if (/flex|grid/.test(cs.display)) ['rowGap', 'columnGap'].forEach(g => { const n = parseFloat(cs[g]); if (!isNaN(n) && !onScale(n)) out.push(`${g} ${n}`); });
  if (['TopLeft', 'TopRight', 'BottomLeft', 'BottomRight'].some(c => parseFloat(cs[`border${c}Radius`]))) out.push('border radius');
  if (cs.boxShadow !== 'none' && cs.boxShadow.split(/,(?![^(]*\))/).some(sh => blurOf(sh))) out.push('shadow with blur');
  return out.map(x => `theme ${x}: ${label(el)}`);
}
function audit(hudEl) {
  const out = [], tol = .6 * hudScale(hudEl), R = el => el.getBoundingClientRect();
  const inside = (a, b) => a.left >= b.left - tol && a.right <= b.right + tol && a.top >= b.top - tol && a.bottom <= b.bottom + tol;
  const hit = (a, b) => a.left < b.right - tol && b.left < a.right - tol && a.top < b.bottom - tol && b.top < a.bottom - tol;
  const all = [...hudEl.querySelectorAll('*')].filter(shown), stageR = R(hudEl);
  all.forEach(el => { if (!inside(R(el), stageR)) out.push(`leaves stage: ${label(el)}`); });
  hudEl.querySelectorAll('.b,[data-cov],.ccard,.refuse,.well').forEach(box => {
    if (!shown(box)) return;
    box.querySelectorAll('*').forEach(el => { if (shown(el) && !inside(R(el), R(box))) out.push(`overflows: ${label(el)} in ${label(box)}`); });
    textRects(box).forEach(t => { if (!inside(t, R(box))) out.push(`text cut: ${label(box)}`); });
  });
  hudEl.querySelectorAll('.b').forEach(b => {
    const chips = [...b.querySelectorAll('.k,.cnt,.gl')].filter(shown).map(R);
    textRects(b).forEach(t => chips.forEach(c => { if (hit(t, c)) out.push(`text under chip: ${label(b)}`); }));
  });
  hudEl.querySelectorAll('.nm2').forEach(n => { if (n.offsetHeight > 28) out.push(`third line: ${label(n)}`); });
  hudEl.querySelectorAll('[data-cov]:not([data-id])').forEach(el => out.push(`covering rect without id: ${label(el)}`));
  all.filter(el => !(el instanceof SVGElement) || el.tagName === 'svg').forEach(el => out.push(...themeProblems(el)));
  const solid = [...hudEl.querySelectorAll('[data-cov],.ccard,.refuse')].filter(shown);
  solid.forEach((a, i) => solid.slice(i + 1).forEach(b => { if (hit(R(a), R(b))) out.push(`overlap: ${label(a)} / ${label(b)}`); }));
  // A queue tile repeats the key of the cell that made it (P2.3b round).
  const keys = [...hudEl.querySelectorAll('.k')].filter(k => shown(k) && !k.closest('.qt')).map(k => k.textContent);
  keys.filter((k, i) => keys.indexOf(k) !== i).forEach(k => out.push(`key twice: ${k}`));
  all.forEach(el => {
    const cs = getComputedStyle(el), paint = [cs.color, cs.backgroundColor, cs.boxShadow, cs.fill, cs.stroke].join(' ');
    const ownText = [...el.childNodes].some(n => n.nodeType === 3 && n.textContent.trim());
    if (paint.includes(CYAN) && !el.closest('.on,.hinted')) out.push(`cyan off a selected control: ${label(el)}`);
    if (paint.includes(AMBER) && !el.closest('.amb,.sq,.arrow,.mini')) out.push(`amber outside its rules: ${label(el)}`);
    if (ownText && REDS.includes(cs.color)) out.push(`red text: ${label(el)}`);
    if (ownText && parseFloat(cs.fontSize) < 12) out.push(`text under 12 px: ${label(el)}`);
    if (ownText && !(el instanceof SVGElement)) { const r = textContrast(el, hudEl); if (r < 4.5) out.push(`contrast ${r.toFixed(1)} under 4.5: ${label(el)}`); }
  });
  return [...new Set(out)];
}
const fontsReady = () => Promise.all([400, 600, 700, 800].map(w => document.fonts.load(`${w} 12px 'Public Sans'`))).then(() => document.fonts.ready);

const app = document.getElementById('app'), picks = {}, notes = {};
const H = new URLSearchParams(location.hash.slice(1));
(H.get('picks') || '').split(',').filter(Boolean).forEach(p => { const [k, x] = p.split(':'); picks[k] = x; });
let step = H.has('final') ? STEPS.length : +(H.get('step') || 0), show = H.get('show') || 'A', full = false;

const unsent = new Map();
let recorded = false;
function recordHtml() {
  if (unsent.size) return `<span class="fail">Not recorded: server not reachable. Kept on this page: ${[...unsent].map(([k, x]) => `${k} ${x || 'comment'}`).join(', ')}.</span>`;
  return recorded ? 'Recorded.' : '';
}
const showRecord = () => document.querySelectorAll('.rec').forEach(e => { e.innerHTML = recordHtml(); });
function post(k, pick, note) {
  const done = ok => { if (ok) { unsent.delete(k); recorded = true; } else unsent.set(k, pick); showRecord(); };

}

function optsWith(chosen) {

const optsFor = (i, variant) => optsWith(i < 0 ? picks : {...picks, [STEPS[i].key]: variant});

function coverageTable() {
  const head = STATES.map(st => `<th>${STATE_LABEL[st]}</th>`).join('');
  const row = (x, sz) => `<tr><th>${x} · ${sz}</th>${STATES.map(st => {
    const pct = coverage(optsFor(step, x), {state: st, size: sz, tier}).toFixed(1);
    return `<td class="${x === show && sz === size && st === state ? 'hl' : ''}">${pct} %</td>`;
  }).join('')}</tr>`;
  return `<table class="cov"><caption>HUD coverage of the screen, ${TIER_LABEL[tier]} tier</caption><tr><th></th>${head}</tr>${['A', 'B'].map(x => SIZE_KEYS.map(sz => row(x, sz)).join('')).join('')}</table>`;
}
function finalCoverageTable(o) {
  const head = STATES.map(st => `<th>${STATE_LABEL[st]}</th>`).join('');
  const row = (t, sz) => `<tr><th>${TIER_LABEL[t]} · ${sz}</th>${STATES.map(st => `<td>${coverage(o, {state: st, size: sz, tier: t}).toFixed(1)} %</td>`).join('')}</tr>`;
  return `<table class="cov"><caption>HUD coverage of the screen with your picks</caption><tr><th></th>${head}</tr>${['full', 'core'].map(t => SIZE_KEYS.map(sz => row(t, sz)).join('')).join('')}</table>`;
}
function viewBar(s) {
  const st = STATES.map((x, i) => `<button class="${x === state ? 'on' : ''}" data-state="${x}"><kbd>${STATE_KEYS[i]}</kbd>${STATE_LABEL[x]}</button>`).join('');
  const sz = SIZE_KEYS.map(x => `<button class="${x === size ? 'on' : ''}" data-size="${x}">${sizeLabel(x)}</button>`).join('');
  const tr = ['core', 'full'].map(x => `<button class="${x === tier ? 'on' : ''}" data-tier="${x}" ${s.tier && x !== s.tier ? 'disabled' : ''}>${TIER_LABEL[x]}</button>`).join('');
  return `<div class="bar">${st}</div><div class="bar"><span class="v4tag" hidden>no backdrop</span><span class="gap"></span><kbd>T</kbd>${tr}<kbd>S</kbd>${sz}<kbd>F</kbd><button data-full>${full ? 'Fit' : '100 %'}</button></div>`;
}
function stageNotes(o, v) {
  const lines = [];
  if (pinnedShown(o, v)) lines.push(`Decided 2026-11-16: ${DECIDED[10]}`);
  if (isCore(v)) lines.push(`Decided 2026-11-16: ${DECIDED[8]}`);
  if (v.state === 'pile') lines.push(`Decided 2026-11-16: ${DECIDED[4]}`);
  return lines.map(l => `<p class="agent">${l}</p>`).join('');
}
function render() {
  app.className = step < STEPS.length ? '' : 'final';
  if (step >= STEPS.length) return renderFinal();
  const s = STEPS[step], v = {state, size, tier}, o = optsFor(step, show);
  const tab = x => `<button class="${x === show ? 'on' : ''}" data-show="${x}"><kbd>${x}</kbd> ${s[x].name}</button>`;
  app.innerHTML = `<div class="top"><span class="n">Step ${step + 1} of ${STEPS.length}</span><h2>${s.q}</h2><p>${s.why}</p><p class="look"><b>Where to look:</b> ${s.look}</p><p class="rec">${recordHtml()}</p></div>
    <div class="bar">${tab('A')}${tab('B')}</div>${viewBar(s)}
    <div class="stagewrap ${full ? 'full' : ''}" style="--ar:${SIZES[size].w}/${SIZES[size].h};--w:${SIZES[size].w}px"><div class="fit" data-w="${SIZES[size].w}">${stage(o, v)}</div></div>
    <div class="under"><div><b>${show}: ${s[show].name}</b>${s.pick === show ? '<span class="cp">Claude\'s pick</span>' : ''}<p>${s[show].note}</p>${stageNotes(o, v)}</div>
    <div class="act"><textarea id="cm" placeholder="Optional comment for Claude">${notes[s.key] || ''}</textarea>
    <button id="pick">Pick ${show} <kbd>Enter</kbd></button>${step ? ' <button id="back">Back</button>' : ''}</div></div>${coverageTable()}`;
  fit();
  placeCards(app);
}

function contrastTable() {
  const tok = x => FLAT[x] || x, dim = x => mix(tok(x), BG, .55);
  const pairs = [['Text on bg', 'text', 'bg', 4.5], ['Text on panel', 'text', 'panel', 4.5], ['Text on button', 'text', 'btn', 4.5], ['Muted on bg', 'muted', 'bg', 4.5],
    ['Muted on panel', 'muted', 'panel', 4.5], ['Muted on well (key chips)', 'muted', 'well', 4.5], ['Amber on bg', 'amber', 'bg', 4.5], ['Amber on button', 'amber', 'btn', 4.5],
    ['Quiet cell: name and cost (muted on quiet fill)', 'muted', 'quiet', 4.5], ['Quiet cell: unaffordable cost (amber on quiet fill)', 'amber', 'quiet', 4.5],
    ['Text in a 45 % cell, step 8 B (composited; HUD rule, WCAG exempts inactive controls)', dim('text'), dim('btn'), 4.5], ['Amber cost in a 45 % cell, step 8 B (composited; HUD rule)', dim('amber'), dim('btn'), 4.5],
    ['Sel on panel2 (non-text)', 'sel', 'panel2', 3], ['You on well (non-text)', 'you', 'well', 3],
    ['Health green on panel (non-text)', HEALTH[0], 'panel', 3], ['Health yellow on panel (non-text)', HEALTH[1], 'panel', 3], ['Health red on panel (non-text)', HEALTH[2], 'panel', 3]];
  const rows = pairs.map(([name, a, b, need]) => {
    const r = contrast(tok(a), tok(b)), ok = r >= need ? '' : 'fail';
    return `<tr><th>${name}</th><td>${need}</td><td class="${ok}">${r.toFixed(1)}</td><td class="${ok}">${ok ? 'FAIL' : 'pass'}</td></tr>`;
  }).join('');
  return `<table class="ctr"><caption>Contrast (WCAG formula, HUD rule 4.5:1 for all text), computed in the page</caption><tr><th>Pair</th><th>Needed</th><th>Ratio</th><th></th></tr>${rows}</table>`;
}
function ownerTable() {
  const rows = OWNERS.map(([name, hex]) => {
    const r = contrast(hex, BG), up = lifted(hex), sw = c => `<span class="sw" style="background:${c}"></span>`;
    const lift = up === hex ? '<td class="l">not needed</td><td></td>' : `<td class="l">${sw(up)}${up}</td><td>${contrast(up, BG).toFixed(2)}</td>`;
    return `<tr><th>${sw(hex)}${name} ${hex}</th><td>${r.toFixed(2)}</td>${lift}</tr>`;
  }).join('');
  return `<table class="ctr"><caption>Owner colours (lift) on --bg, edge and bar need 3:1</caption><tr><th>Colour</th><th>Ratio</th><th>Lightened</th><th>Ratio</th></tr>${rows}</table>`;
}
function wrapLines(ctx, text, width) {
  const space = ctx.measureText(' ').width;
  let lines = 1, line = 0;
  text.split(' ').forEach(w => { const ww = ctx.measureText(w).width; if (line && line + space + ww > width) { lines++; line = ww; } else line += (line ? space : 0) + ww; });
  return lines;
}
function nameFit() {
  const ctx = document.createElement('canvas').getContext('2d');
  ctx.font = `600 12px ${FONT}`;
  return NAMES.map(([name, factions]) => {
    const w = ctx.measureText(name).width, word = Math.max(...name.split(' ').map(x => ctx.measureText(x).width)), lines = wrapLines(ctx, name, TWO_NAME_W);
    return {name, factions, w, word, lines, two: word <= TWO_NAME_W && lines <= 2, one: w <= ONE_NAME_W};
  });
}
function nameFitRows() {
  const verdict = ok => `<td class="${ok ? '' : 'fail'}">${ok ? 'fits' : 'MISS'}</td>`;
  return nameFit().map(f => `<tr><th>${f.name}</th><td class="l">${f.factions}</td><td>${f.w.toFixed(1)}</td><td>${f.word.toFixed(1)}</td><td>${f.lines}</td>${verdict(f.two)}${verdict(f.one)}</tr>`).join('');
}
function nameFitTable() {
  return `<table class="ctr" id="namefit"><caption>Name fit at 12 / 600 Public Sans (canvas, after fonts load)</caption><tr><th>Name</th><th>Factions</th><th>Name px</th><th>Widest word px</th><th>Lines at ${TWO_NAME_W}</th><th>Cell two</th><th>Cell one (≤ ${ONE_NAME_W})</th></tr><tr><td colspan="7">measuring…</td></tr></table>`;
}
function gridTable() {
  const rows = GRID_TABLE.map(([menu, k, ...names]) => `<tr><th>${menu}</th><td>${k}</td>${names.map(n => `<td class="l">${n}</td>`).join('')}</tr>`).join('');
  return `<table class="ctr"><caption>Grid across factions (proposal)</caption><tr><th>Menu</th><th>Key</th><th>USA</th><th>China</th><th>FRC</th></tr>${rows}</table>`;
}
function renderFinal() {
  const o = optsFor(-1, null);
  const fig = (st, t) => `<figure><figcaption>${TIER_LABEL[t]} · 1280 x 800</figcaption><div class="fit" data-w="1280" style="--ar:1280/800">${stage(o, {state: st, size: '1280x800', tier: t})}</div></figure>`;
  const group = st => `<div class="state"><h3>${STATE_LABEL[st]}</h3><div class="pairs">${fig(st, 'full')}${fig(st, 'core')}</div></div>`;
  app.innerHTML = `<div class="top"><span class="n">Result</span><h2>Every state with your picks</h2>
    <p>${STEPS.map(s => `${s.key} ${picks[s.key] ? s[picks[s.key]].name : '(default)'}`).join(' · ')}.</p><p class="rec">${recordHtml()}</p><p>Tell Claude you are done.</p></div>
    <div class="act" style="max-width:700px;margin-bottom:24px"><textarea id="cm" placeholder="Anything else: what to change, what is missing"></textarea><button id="back">Back to the steps</button></div>
    ${finalCoverageTable(o)}<div class="tables" style="margin-top:24px">${contrastTable()}${ownerTable()}${nameFitTable()}${gridTable()}</div>
    <h3 class="sec">Decided 2026-11-16</h3><ul class="notes">${DECIDED.map(n => `<li>${n}</li>`).join('')}</ul>
    <h3 class="sec">Agent calls</h3><ul class="notes">${AGENT_CALLS.map(n => `<li>${n}</li>`).join('')}</ul>
    <h3 class="sec">Where the page departs from the spec</h3><ul class="notes">${DEVIATIONS.map(n => `<li>${n}</li>`).join('')}</ul>` +
    STATES.map(group).join('') +
    `<h3 class="sec">P2.3b states (Core only)</h3>${NEW_STATES.map(st => `<div class="state"><h3>${STATE_LABEL[st]}</h3><div class="pairs">${fig(st, 'core')}</div></div>`).join('')}`;
  fit();
  placeCards(app);
  fontsReady().then(() => { const t = document.getElementById('namefit'); if (t) t.tBodies[0].innerHTML = t.tBodies[0].rows[0].outerHTML + nameFitRows(); });
}
function enter(i) {
  step = i; show = 'A'; tier = 'full';
  if (STEPS[i]) { state = STEPS[i].state; tier = STEPS[i].tier || 'full'; }
}
function choose() {
  const s = STEPS[step];
  picks[s.key] = show;
  post(s.key, show, notes[s.key] || '');
  enter(step + 1);
  render(); scrollTo(0, 0);
}
function back() { enter(Math.min(step, STEPS.length) - 1); render(); }

document.addEventListener('click', e => {
  const t = e.target, hit = x => t.closest(x);
  if (hit('[data-tg]')) hit('[data-tg]').classList.toggle('on');
  else if (hit('[data-show]')) { show = hit('[data-show]').dataset.show; render(); }
  else if (hit('[data-state]')) { state = hit('[data-state]').dataset.state; render(); }
  else if (hit('[data-size]')) { size = hit('[data-size]').dataset.size; render(); }
  else if (hit('[data-tier]')) { tier = hit('[data-tier]').dataset.tier; render(); }
  else if (hit('[data-full]')) { full = !full; render(); }
  else if (t.id === 'pick') choose();
  else if (t.id === 'back') back();
});
document.addEventListener('input', e => {
  if (e.target.id !== 'cm') return;
  const k = step < STEPS.length ? STEPS[step].key : 'overall';
  notes[k] = e.target.value;
  if (k === 'overall') post(k, null, e.target.value);
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || step >= STEPS.length || e.metaKey || e.ctrlKey) return;
  const k = e.key.toLowerCase(), s = STEPS[step];
  if (k === 'a' || k === 'arrowleft') show = 'A';
  else if (k === 'b' || k === 'arrowright') show = 'B';
  else if (STATE_KEYS.includes(k)) state = STATES[STATE_KEYS.indexOf(k)];
  else if (k === 'n') state = STATES[(STATES.indexOf(state) + 1) % STATES.length];
  else if (k === 's') size = SIZE_KEYS[(SIZE_KEYS.indexOf(size) + 1) % SIZE_KEYS.length];
  else if (k === 't' && !s.tier) tier = tier === 'full' ? 'core' : 'full';
  else if (k === 'f') full = !full;
  else if (k === 'enter') return choose();
  else return;
  render();
});
document.addEventListener('mouseover', e => {
  const hudEl = e.target.closest && e.target.closest('.hud');
  if (hudEl) updateCard(hudEl, e.target.closest('[data-cell]'));
});
document.addEventListener('mouseout', e => {
  const hudEl = e.target.closest && e.target.closest('.hud');
  if (hudEl && !(e.relatedTarget && hudEl.contains(e.relatedTarget))) updateCard(hudEl, null);
});
addEventListener('resize', fit);

function shot() {
  document.body.style.cssText = 'overflow:hidden;background:#000';
  app.style.cssText = 'max-width:none;padding:0';
  const scale = +(H.get('scale') || 1);
  app.innerHTML = `<div style="transform:scale(${scale});transform-origin:0 0">${stage(optsFor(-1, null), {state: H.get('shot'), size, tier})}</div>`;
  placeCards(app);
  fontsReady().then(() => { placeCards(app); audit(app.querySelector('.hud')).forEach(p => { err.textContent += `layout: ${p}\n`; }); });
}
const TYPE = [{role: 'panel title', size: 14, weight: 700}, {role: 'row, button and command names', size: 13, weight: 600},
  {role: 'cell names (two lines, line height 14)', size: 12, weight: 600}, {role: 'numbers', size: 13, weight: 700}, {role: 'credits value', size: 16, weight: 700},
  {role: 'labels (uppercase, letter-spacing .1em)', size: 12, weight: 700}, {role: 'hints', size: 12, weight: 400}, {role: 'key chips', size: 12, weight: 700}];
function nameChildren(hudEl) {
  [['.sel .krow', 'selection.row'], ['.sel .slot', 'selection.queue'], ['.card .slot', 'card.queue'], ['.pinned .slot', 'pinned.queue'], ['.pinned .cell', 'pinned.cell']]
    .forEach(([sel, id]) => hudEl.querySelectorAll(sel).forEach((el, i) => { el.dataset.id = `${id}.${i + 1}`; }));
}
const rectKind = el => el.matches('.cell,.well') ? 'cell' : el.matches('.krow') ? 'row' : el.matches('.slot') ? 'slot' : el.matches('.ccard') ? 'popup' : el.matches('.cmd') ? 'button' : 'slab';
function cellInfo(el) {
  const key = el.dataset.id.split('.').pop();
  if (el.matches('.well')) return {key, state: 'empty'};
  const chip = el.querySelector('.k').textContent, info = {text: el.dataset.cell || el.querySelector('.cn').firstChild.textContent.trim(), key};
  if (chip !== key) info.chip = chip;
  if (el.matches('.on')) return {...info, state: 'armed'};
  return el.dataset.reason ? {...info, state: 'blocked', reason: el.dataset.reason} : {...info, state: 'ready'};
}
const slotInfo = el => el.matches('.empty') ? {state: 'empty'} : {state: 'filled', text: el.textContent.trim() || el.dataset.item};
function fieldsOf(el) {
  if (el.matches('.card .cell,.card .well')) return cellInfo(el);
  if (el.matches('.slot')) return slotInfo(el);
  if (el.matches('.krow')) return {text: el.dataset.name, count: +el.dataset.count};
  return {};
}
const r2 = n => Math.round(n * 100) / 100;
function layoutRect(el, hudEl) {
  const hr = hudEl.getBoundingClientRect(), r = el.getBoundingClientRect(), sc = hudScale(hudEl);
  const out = {id: el.dataset.id, kind: rectKind(el), x: r2((r.left - hr.left) / sc), y: r2((r.top - hr.top) / sc), w: r2(r.width / sc), h: r2(r.height / sc)};
  if (el.hasAttribute('data-cov')) out.covers = true;
  return {...out, ...fieldsOf(el)};
}
function layoutScreen(o, v) {
  const pct = coverage(o, v), {w, h, k} = SIZES[v.size];
  probeStage(o, v);
  placeCards(probe);
  const hudEl = probe.querySelector('.hud');
  nameChildren(hudEl);
  const rects = [...hudEl.querySelectorAll('[data-id]')].filter(shown).map(el => layoutRect(el, hudEl));
  return {state: v.state, tier: v.tier, size: [w, h], k, coverage_pct: r2(pct), rects};
}
async function layoutPicks() {
  if (H.get('picks')) return picks;
  const saved = await fetch('picks.json').then(r => r.ok ? r.json() : {}, () => ({}));
  return Object.fromEntries(STEPS.filter(s => saved[s.key] && s[saved[s.key].pick]).map(s => [s.key, saved[s.key].pick]));
}
async function exportLayout() {
  await fontsReady();
  const chosen = await layoutPicks(), o = optsWith(chosen), screens = [];
  for (const st of STATES) for (const t of ['full', 'core']) for (const sz of SIZE_KEYS) screens.push(layoutScreen(o, {state: st, tier: t, size: sz}));
  probe.innerHTML = '';
  const doc = {meta: {picks: Object.fromEntries(STEPS.map(s => [s.key, {pick: chosen[s.key] || 'A (default)', value: o[s.key]}])), font: 'Public Sans', unit: 'HUD px, origin top left',
    scale: 'k = min(width / 1280, height / 720)', source: 'docs/images/hud-v5/source/round1.html'},
    tokens: Object.fromEntries(Object.entries(FLAT).filter(([k]) => k !== 'r')), type: TYPE, screens};
  const r = await fetch('/layout', {method: 'POST', body: JSON.stringify(doc)}).catch(() => null);
  app.textContent = r && r.status === 204 ? `Layout posted: ${screens.length} screens.` : 'Layout not posted: server not reachable.';
}
async function auditAll() {
  await fontsReady();
  const variants = [['defaults', {}], ...STEPS.map(s => [`${s.key}:B`, {[s.key]: 'B'}])], problems = [];
  let n = 0;
  for (const [name, chosen] of variants) {
    for (const st of STATES) for (const t of ['full', 'core']) for (const sz of SIZE_KEYS) {
      probeStage(optsWith(chosen), {state: st, size: sz, tier: t});
      placeCards(probe);
      audit(probe.querySelector('.hud')).forEach(p => problems.push(`${name} ${st} ${t} ${sz}: ${p}`));
      n++;
    }
  }
  probe.innerHTML = '';
  const fits = nameFit().map(f => `${f.name}: ${f.w.toFixed(1)} / word ${f.word.toFixed(1)} / ${f.lines} lines / two ${f.two ? 'fits' : 'MISS'} / one ${f.one ? 'fits' : 'MISS'}`);
  const covs = ['full', 'core'].flatMap(t => SIZE_KEYS.map(sz => `${t} ${sz}: ${STATES.map(st => `${st} ${coverage(DEFAULTS, {state: st, size: sz, tier: t}).toFixed(1)}`).join(', ')}`));
  const expected = problems.filter(p => p.startsWith('dim:B') && p.includes(': contrast ')).length;
  const text = `Audit done: ${n} screens, ${problems.length} problems (${expected} of them the expected contrast fails of dim:B)\n${problems.join('\n')}\n${fits.join('\n')}\n${covs.join('\n')}`;
  app.innerHTML = `<pre style="white-space:pre-wrap;font-size:12px">${text}</pre>`;
  // Headless screenshots fire before this finishes, so a local listener can collect the text instead.
  if (H.get('report')) fetch(`http://127.0.0.1:${+H.get('report')}/`, {method: 'POST', mode: 'no-cors', body: text});
}
document.body.insertAdjacentHTML('beforeend', '<div id="probe" style="position:absolute;left:-10000px;top:0;visibility:hidden"></div>');
if (H.has('audit')) { app.innerHTML = '<h2>Audit running…</h2>'; auditAll(); }
else if (H.has('layout')) { app.textContent = 'Building layout…'; exportLayout(); }
else if (H.has('shot')) shot();
else {
  render();
  // Coverage depends on text widths, so measure again once Public Sans is in.
  fontsReady().then(() => { Object.keys(covCache).forEach(k => delete covCache[k]); render(); });
}
</script>
