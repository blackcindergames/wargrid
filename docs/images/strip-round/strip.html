<!doctype html>
<meta charset="utf-8">
<title>Wargrid · production strip study</title>
<!-- P16 production strip round: variants as hash or query params; the defaults are the round's recommendations. -->
<style>
@font-face{font-family:Public;src:url(../../../game/fonts/PublicSans-Regular.ttf)}
@font-face{font-family:Public;src:url(../../../game/fonts/PublicSans-SemiBold.ttf);font-weight:600}
@font-face{font-family:Public;src:url(../../../game/fonts/PublicSans-Bold.ttf);font-weight:700}
:root{--bg:#121c24;--btn:#223241;--panel2:#26384a;--line:#2e3f4b;--well:#0c141a;--text:#eef3f5;--muted:#93a5b0;--sel:#60e5ed;--warn:#f47b6c;--you:#628ffa;--glyph:#bacbd5;--idle:#7b8d99}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--text);font:600 13px Public,sans-serif;font-variant-numeric:tabular-nums;overflow:hidden}
main{position:relative;width:1280px;height:720px;background:url(../hud-v5/source/worlds/w-factory.png) center/cover;transform-origin:top left;overflow:hidden}
.slab{display:flex;align-items:center;gap:8px;height:32px;padding:0 7px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.slab.on{border-color:var(--sel)}
.ts{position:absolute;left:8px;top:8px;display:flex;gap:8px}
.lab{font:700 12px/14px Public;letter-spacing:.1em;color:var(--muted)}
.num{font-weight:700}.cr{font-size:16px}
.warn{color:var(--warn)}
.sw{width:8px;height:8px;background:var(--you);flex:none}
.ghost{position:absolute;visibility:hidden;left:0;top:-100px}
.menu{position:absolute;right:8px;top:8px;width:88px;background:var(--btn);padding:0 8px;justify-content:space-between}
kbd{font:700 12px/18px Public;color:var(--muted);background:var(--well);padding:0 4px;height:18px}
.playtest{position:absolute;right:8px;top:48px}
.strip{position:absolute;top:8px;gap:4px;padding:0 3px}
.sep{width:1px;height:16px;background:var(--line);flex:none}
.chips{display:flex;align-items:center;gap:4px}
.chip{display:flex;align-items:center;gap:8px;height:24px;padding:0 8px;background:var(--btn);flex:none;position:relative}
.chip svg{width:18px;height:18px;fill:var(--glyph);flex:none}
.pb{display:block;width:40px;height:4px;background:var(--well);flex:none}
.pb i{display:block;height:100%;background:var(--you)}
.pb.slow i{background:var(--warn)}
.cnt{font:700 12px Public;color:var(--muted);min-width:18px}
.stack .chip{flex-direction:column;justify-content:center;gap:2px;width:48px;height:26px;padding:0 4px}
.loose .chip{height:32px;background:var(--bg);border:1px solid var(--line)}
.chip.sel{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--sel)}
.chip.idle svg{fill:var(--idle)}
[data-idle=muted] .chip.idle .pb{visibility:hidden}
[data-idle=hollow] .chip.idle{background:var(--bg);box-shadow:inset 0 0 0 1px #344956}
[data-idle=hollow] .chip.idle .pb{visibility:hidden}
[data-idle=bar] .chip.idle .pb{background:none;box-shadow:inset 0 0 0 1px var(--idle)}
.chip.more{color:var(--muted);width:auto;padding:0 8px}
.chip.more.hov{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--muted)}
.tip{position:absolute;padding:7px 10px;background:var(--well);border:1px solid #526775;font:600 12px/17px Public;color:var(--muted);white-space:nowrap;z-index:2}
.tip b{display:block;color:var(--text);font-size:13px}
.tip .tag{display:block;font:700 11px Public;letter-spacing:1px;color:#96aab6;margin-bottom:4px}
.cursor{position:absolute;width:14px;height:21px;fill:#fff;stroke:#000;stroke-width:1;filter:drop-shadow(0 1px 1px #000);z-index:3}
.card{position:absolute;right:0;bottom:0;width:432px;height:204px;display:grid;padding:7px;grid-template:repeat(3,60px)/repeat(4,100px);gap:4px;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--you)}
.cell{border:1px solid var(--line);background:#0f1820;padding:4px 7px;position:relative;font-size:12px}
.cell.item{background:var(--btn)}.cell.hov{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--muted)}
.cell kbd{position:absolute;right:4px;top:4px}.cell .name{display:block;margin-top:3px;font-size:12px;line-height:14px}
.cell .cost{font-size:13px}
</style>
<main></main>
<script src="../hud-v5/source/glyphs3.js"></script>
<script>
const params=new URLSearchParams(location.hash.length>1?location.hash.slice(1):location.search);
const opt=(k,d)=>params.get(k)??d;
const state=opt('state','mixed'), chipLook=opt('chip','stack'), group=opt('group','slab'), idleLook=opt('idle','bar'), order=opt('order','kind'), cap=opt('cap','8'), anchor=opt('anchor','right');
const LOW='LOW POWER · DEFENCES OFF', CREDITS=50000;
const ARROW='<svg width="12" height="8" viewBox="0 0 12 8" style="flex:none"><path d="M0 4h10.5M7 .5 10.5 4 7 7.5" fill="none" stroke="#93a5b0" stroke-width="1.5"/></svg>';
const COIN='<svg width="15" height="15"><circle cx="7.5" cy="7.5" r="7.5" fill="#f47b6c"/></svg>';
const CURSOR='<svg class="cursor" style="left:XXpx;top:YYpx" viewBox="0 0 14 21"><path d="M1 1v16l4-4 3 7 3-1-3-7h5z"/></svg>';
const RANK={hq:0,depot:1,barracks:2,factory:3};
const NAME={hq:'Headquarters',depot:'Supply Depot',barracks:'Barracks',factory:'Vehicle Factory'};
const FIRST={hq:'builder',depot:'collector',barracks:'rifle_infantry',factory:'light_vehicle'};
const UNIT={builder:['Bulldozer',5],collector:['Supply Truck',10],rifle_infantry:['Militia',10],rocket_infantry:['Anti-Tank Trooper',5],light_vehicle:['Medium Tank',10],tank:['Rotary Gun Tank',10]};
// p(kind, unit in production or null, done, queue, extra): last = last-made unit of an idle producer.
const p=(kind,unit,done,queue,x={})=>({kind,unit,done,queue,...x});
// Listed in the order they were built; times are the China data's (30 ticks a second).
const MIXED=[p('hq','builder',.5,1),p('depot'),p('barracks','rifle_infantry',.3,1),p('factory','light_vehicle',.62,4,{sel:true}),p('barracks',null,0,0,{last:'rocket_infantry'}),p('factory','tank',.15,2)];
const MANY=[p('hq','builder',.4,1),p('depot','collector',.7,1),p('barracks','rifle_infantry',.5,3),p('factory','light_vehicle',.62,4,{sel:true}),p('depot'),p('barracks','rocket_infantry',.2,1),p('factory','tank',.15,2),p('factory','light_vehicle',.8,1),p('barracks',null,0,0,{last:'rifle_infantry'}),p('factory',null,0,0,{last:'tank'}),p('factory','tank',.4,5),p('barracks','rifle_infantry',.9,2)];
const STATES={
 mixed:MIXED, hover:MIXED, many:MANY, more:MANY,
 card:MIXED.map(x=>({...x,sel:false})),
 low:MIXED.map((x,i)=>i===5?{...x,done:1,blocked:true}:x),
 idle:[p('hq'),p('depot'),p('barracks',null,0,0,{last:'rifle_infantry'}),p('factory',null,0,0,{last:'tank'}),p('factory')],
 frc:[p('hq'),p('barracks','rifle_infantry',.4,2),p('factory','light_vehicle',.62,3,{sel:true}),p('factory',null,0,0,{last:'tank'})]};
const main=document.querySelector('main');
main.dataset.idle=idleLook;
const glyph=id=>'<svg aria-hidden="true" viewBox="0 0 48 48">'+GLYPH3['china_'+id]+'</svg>';
// Headquarters and Supply Depots show only while they produce; an idle military producer keeps its last unit (first as fallback).
const onStrip=x=>x.unit!=null||(x.kind!=='hq'&&x.kind!=='depot');
function chip(x){
 const busy=x.unit!=null, slow=busy&&(state==='low'||x.blocked);
 const bar='<span class="pb'+(slow?' slow':'')+'"><i style="width:'+(busy?Math.round(x.done*100):0)+'%"></i></span>';
 const count=chipLook==='count'?'<b class="cnt">'+(busy?'×'+x.queue:'')+'</b>':'';
 return '<span class="chip'+(busy?'':' idle')+(x.sel?' sel':'')+'">'+glyph(busy?x.unit:x.last||FIRST[x.kind])+bar+count+'</span>';
}
function sorted(list){
 const out=list.map((x,i)=>({...x,i})).filter(onStrip);
 if(order==='kind')out.sort((a,b)=>RANK[a.kind]-RANK[b.kind]||a.i-b.i);
 if(order==='busy')out.sort((a,b)=>(a.unit==null)-(b.unit==null)||a.i-b.i);
 return out;
}
function credits(now,after){
 const to=after==null?'':ARROW+'<b class="num cr">'+after+'</b>';
 return '<div class="slab'+(after!=null?' on':'')+'"><i class="sw"></i><span class="lab">CREDITS</span><b class="num cr">'+now+'</b>'+to+'</div>';
}
function power(now,after,words){
 const low=s=>{const [u,a]=s.split(' / ').map(Number);return u>a};
 const to=after==null?'':ARROW+'<b class="num'+(low(after)?' warn':'')+'">'+after+'</b>';
 return '<div class="slab'+(after!=null?' on':'')+'"><span class="lab">POWER</span><b class="num'+(low(now)?' warn':'')+'">'+now+'</b>'+to+(words?'<span class="lab warn">'+LOW+'</span>':'')+'</div>';
}
// The game holds both slabs at their widest forecast while the pointer is on the build card (hud.gd _ready).
const ghost='<div class="ts ghost">'+'<div class="slab" id="gc"><i class="sw"></i><span class="lab">CREDITS</span><b class="num cr">00000</b>'+ARROW+'<b class="num cr">−0000</b>'+COIN+'</div>'+
 '<div class="slab" id="gp"><span class="lab">POWER</span><b class="num">00 / 00</b>'+ARROW+'<b class="num">00 / 00</b><span class="lab">'+LOW+'</span></div></div>';
// Overflow folds from the start of the order, so the last kinds (the factories) stay.
function stripHtml(list,limit){
 const rest=list.length-limit;
 return (rest>0?'<span class="chip more'+(state==='more'?' hov':'')+'">+'+rest+'</span>':'')+list.slice(rest).map(chip).join('');
}
function buildCard(){
 const items={0:['Power Plant',1000,'Q'],1:['Supply Depot',1500,'W'],2:['Barracks',500,'E'],3:['Vehicle Factory',2000,'R'],4:['Rotary Gun Tower',1200,'A'],11:['Back',null,'V']};
 let html='<div class="card">';
 for(let i=0;i<12;i++){
  const it=items[i];
  html+='<div class="cell'+(it?' item':'')+(i===4?' hov':'')+'">'+(it?(it[1]?'<span class="cost">'+it[1]+'</span>':'')+'<kbd>'+it[2]+'</kbd><span class="name">'+it[0]+'</span>':'')+'</div>';
 }
 return html+'</div>'+CURSOR.replace('XX',1280-432+4+7+82).replace('YY',720-204+64+7+38);
}
const scaleK=()=>Math.min(innerWidth/1280,innerHeight/720);
const box=el=>{const r=el.getBoundingClientRect(),k=scaleK(),m=main.getBoundingClientRect();return {x:(r.left-m.left)/k,y:(r.top-m.top)/k,w:r.width/k,h:r.height/k}};
// A tip sits 8 under its chip and never covers the Playtest chip (right 8, top 48) or leaves the screen.
function tip(target,html){
 const b=box(target);
 main.insertAdjacentHTML('beforeend','<div class="tip">'+html+'</div>'+CURSOR.replace('XX',b.x+b.w/2).replace('YY',b.y+b.h/2));
 const t=main.querySelector('.tip'), play=box(main.querySelector('.playtest')), w=box(t).w;
 const right=b.y+b.h+8+box(t).h>play.y?play.x-8:1272;
 t.style.left=Math.max(8,Math.min(b.x,right-w))+'px';t.style.top=(b.y+b.h+8)+'px';
}
function render(){
 const list=sorted(STATES[state]||MIXED), card=state==='card', frc=state==='frc';
 const c=card?credits(CREDITS,CREDITS-1200):credits(CREDITS);
 const pw=frc?'':card?power('8 / 10','11 / 10',true):state==='low'?power('12 / 10',null,true):power('8 / 10');
 main.innerHTML=ghost+'<div class="ts">'+c+pw+'</div>'+
  '<div class="slab menu"><span>Menu</span><kbd>Esc</kbd></div><div class="slab playtest"><span class="lab">PLAYTEST</span><b class="num">0 / 10</b></div>'+(card?buildCard():'');
 const ts=main.querySelector('.ts:not(.ghost)');
 const heldC=main.querySelector('#gc').offsetWidth, heldP=frc?0:main.querySelector('#gp').offsetWidth;
 if(card){ts.children[0].style.width=heldC+'px';ts.children[1].style.width=heldP+'px'}
 let strip;
 if(group==='power'&&!frc){
  const pslab=ts.children[1];
  pslab.insertAdjacentHTML('beforeend','<i class="sep" style="margin-left:4px"></i><span class="chips'+(chipLook==='stack'?' stack':'')+'"></span>');
  strip=pslab.querySelector('.chips');
 }else{
  main.insertAdjacentHTML('beforeend','<div class="strip chips'+(group==='loose'?' loose':' slab')+(chipLook==='stack'?' stack':'')+'"></div>');
  strip=main.querySelector('.strip');
  if(group==='loose')strip.style.padding='0';
  if(anchor==='right')strip.style.right='104px';
  else if(anchor==='fixed')strip.style.left=(8+heldC+8+(heldP?heldP+8:0))+'px';
  else{strip.style.position='relative';strip.style.top='0';ts.append(strip)}
 }
 let limit=cap==='all'?list.length:Math.min(list.length,Number(cap));
 strip.innerHTML=stripHtml(list,limit);
 // 'all' keeps every chip that fits between the power slab and Menu, then +N.
 if(cap==='all'&&group!=='power'&&anchor==='right'){
  const edge=()=>box(ts).x+box(ts).w+8;
  while(limit>1&&box(strip).x<edge()){limit--;strip.innerHTML=stripHtml(list,limit)}
 }
 if(state==='hover'){
  const v=list.find(z=>z.sel), [name,secs]=UNIT[v.unit];
  tip(strip.querySelector('.chip.sel'),'<b>'+NAME[v.kind]+'</b>'+name+' · '+Math.ceil(secs*(1-v.done))+'s · QUEUE '+v.queue+' / 9<br>Click: select · Double-click: go there');
 }
 if(state==='more'&&strip.querySelector('.more')){
  const hidden=list.slice(0,list.length-limit).map(x=>NAME[x.kind]+' · '+(x.unit?UNIT[x.unit][0]+' '+Math.ceil(UNIT[x.unit][1]*(1-x.done))+'s':'idle'));
  tip(strip.querySelector('.more'),'<span class="tag">NOT ON THE STRIP</span>'+hidden.join('<br>'));
 }
}
function scale(){main.style.transform='scale('+scaleK()+')'}
scale();
render();
// Again once Public Sans is in, so the held widths and tips are measured in it.
Promise.all(['400','600','700'].map(w=>document.fonts.load(w+' 13px Public'))).then(render);
onresize=()=>{scale();render()};
onhashchange=()=>location.reload();
</script>
