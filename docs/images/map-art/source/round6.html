<script>

const tagOf = (b) => (b >= 40 ? 40 : b >= 15 ? 15 : b >= 5 ? 5 : b >= 1 ? 1 : 0);

// ---------- counts ----------

// ---------- colour maths ----------
const hex2rgb = (h) => [1, 3, 5].map((i) => parseInt(h.substr(i, 2), 16) / 255);

  zoom: () => { const s = window.CAND6[STEPS6[UI.n]]; UI.zoom = ZOOMS[(ZOOMS.indexOf(shownZoom(s)) + 1) % ZOOMS.length]; UI.zoomSet = true; renderPick(); },
  head: () => { UI.heading = (UI.heading + 1) % 8; renderPick(); },
};
function startPick(saved) {
  Object.entries(saved).forEach(([k, v]) => {
    if (!STEPS6.includes(k) || !v) return;
    UI.picked[k] = v.pick; UI.notes[k] = v.note || '';
    if (['A', 'B'].includes(v.pick) && window.CAND6[k] && window.CAND6[k][v.pick]) UI.show[k] = v.pick;
  });
  app.addEventListener('click', (e) => {
    const hit = (q) => e.target.closest(q);
    if (hit('[data-step]')) go(+hit('[data-step]').dataset.step);
    else if (hit('[data-show]')) { UI.show[STEPS6[UI.n]] = hit('[data-show]').dataset.show; renderPick(); }
    else if (hit('[data-act]')) ACTS[hit('[data-act]').dataset.act]();
    else if (hit('#pick')) choose();
    else if (hit('#change')) choose('change');
  });
  app.addEventListener('input', (e) => { if (e.target.id === 'cm') UI.notes[STEPS6[UI.n]] = e.target.value; });
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'TEXTAREA' || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase(), key = STEPS6[UI.n], s = window.CAND6[key];
    if (k === 'enter' && e.target.tagName === 'BUTTON') return;
    if ((k === 'a' || k === 'b') && s && s[k.toUpperCase()] && !isConfirm(s)) { UI.show[key] = k.toUpperCase(); renderPick(); }
    else if (k === 'enter') choose();
    else if (k === 'h') ACTS.hud();
    else if (k === 'g') ACTS.ground();
    else if (k === 'z') ACTS.zoom();
    else if (k === '[' || k === ']') { UI.heading = (UI.heading + (k === ']' ? 1 : 7)) % 8; renderPick(); }
    else if (k === 'n') ACTS.next();
    else if (k === 'p') ACTS.prev();
  });
  renderPick();
}
const fetchPicks = (loud) => fetch('picks.json').then((r) => (r.ok ? r.json() : {}), () => ({})).then((j) => { if (j && typeof j === 'object' && !Array.isArray(j)) return j; throw new Error('not an object'); })  .catch(() => { if (loud) addErr('picks.json unreadable: showing the recommended options'); return {}; });
async function start() {
  stepProblems().forEach(addErr);
  const name = H.get('pic'), rep = H.get('report'), stepPic = name && STEP_PIC.exec(name), shot = H.has('step') && H.get('shot') === '1';
  const job = { export: runExport, roundtrip: runRoundtrip, audit: runAudit }[[...H.keys()].find((k) => ['export', 'roundtrip', 'audit'].includes(k))];
  const pickPage = !(name || rep || job || shot || H.has('list') || H.has('world')), scale = H.get('scale') === '2' ? 2 : 1;
  const wantHud = H.get('hud') || (name && PICS[name] && PICS[name].hud);
  const [, hudOpts, saved] = await Promise.all([loadFonts(), wantHud || pickPage ? hudOptions().catch((e) => { if (wantHud) throw e; return null; }) : null, fetchPicks(pickPage)]);
  SAVED = saved;
  if (job) await job();
  else if (rep) {
    if (!reports[rep]) throw new Error('unknown report ' + rep);
    const file = H.get('name') || rep;
    if (!NAME_RE.test(file)) throw new Error('bad report name ' + file);
    await post(file, reports[rep]());
  } else if (stepPic) drawStepShot(+stepPic[1], stepPic[2], stepPic[3] ? 'dark' : 'sand', H.get('zoom'), scale);
  else if (shot) drawStepShot(+H.get('step'), H.get('show'), H.get('ground'), H.get('zoom'), scale);
  else if (name && PICS[name]) drawPic(name, wantHud ? hudOpts : null);
  else if (H.has('world')) { document.body.className = 'shot'; app.className = 'shot'; app.innerHTML = ''; app.appendChild(MARKS.worldStage(H.get('world'), scale)); }
  else if (pickPage) {
    UI.hudOpts = hudOpts;
    startPick(saved);
  } else app.innerHTML = '<h2>Map art pictures</h2><ul>' + Object.keys(PICS).map((n) => `<li><a href="#pic=${n}&as=shot">${n}</a></li>`).join('') + '</ul>';
}
start().catch((e) => addErr('start: ' + (e && e.stack || e)));
</script>
