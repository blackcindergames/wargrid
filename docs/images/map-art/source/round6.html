      else if (r.status === 'tie') { ties++; shade += r.knife; lines.push(`TIE ${p.key} ${r.msg}`); } else if (KNOWN_FAILING.includes(p.key)) { known++; lines.push(`FAIL-KNOWN ${p.key} ${r.msg} | listed failing (user, 2026-11-17), P2.4 paint-order audit`); } else { bad++; lines.push(`FAIL ${p.key} ${r.msg}`); }
    });
    have.forEach((g, key) => { if (!want.has(key)) { lines.push('EXTRA ' + key); bad++; } });
    lines.push(bad ? `FAIL ${bad} of ${poses.length}` : `PASS ${poses.length} max ${worst.toExponential(2)} px ties ${ties} shade ${shade} triangles known-failing ${known}`);
  } catch (e) { lines.push('FAIL ' + (e && e.message || e)); }
  await post('roundtrip', lines.join('\n') + '\n');
}

// ---------- audit ----------
const SLAB = '#121c24';
const lin = (c) => (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
const lum = (rgb) => { const [r, g, b] = rgb.map(lin); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const contrast = (a, b) => { const [hi, lo] = [lum(hex2rgb(a)), lum(hex2rgb(b))].sort((x, y) => y - x); return (hi + 0.05) / (lo + 0.05); };
const MACHADO = {
  deuteranopia: [[0.367322, 0.860646, -0.227968], [0.280085, 0.672501, 0.047413], [-0.011820, 0.042940, 0.968881]],
  protanopia: [[0.152286, 1.052583, -0.204868], [0.114503, 0.786281, 0.099216], [-0.003882, -0.048116, 1.051998]] };
function lab(linRgb) {
  const [r, g, b] = linRgb;
  const X = (0.4124564 * r + 0.3575761 * g + 0.1804375 * b) / 0.95047, Y = 0.2126729 * r + 0.7151522 * g + 0.072175 * b, Z = (0.0193339 * r + 0.119192 * g + 0.9503041 * b) / 1.08883;
  const f = (t) => (t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116);
  return [116 * f(Y) - 16, 500 * (f(X) - f(Y)), 200 * (f(Y) - f(Z))];
}
const simulate = (hex, m) => { const l = hex2rgb(hex).map(lin); return m ? m.map((row) => Math.min(1, Math.max(0, row[0] * l[0] + row[1] * l[1] + row[2] * l[2]))) : l; };
const dE = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
function minDistance(ha, hb) {
  const L = (h, m) => lab(simulate(h, m));
  return Math.min(...[null, MACHADO.deuteranopia, MACHADO.protanopia].map((m) => dE(L(ha, m), L(hb, m))));
}
const SHARE_FLOOR = { infantry: 0.3, laborer: 0.3, rocket_infantry: 0.2, tank_usa: 0.28, tank_china: 0.28, tank_china_gatling: 0.28, tank_frc: 0.28 };
function ownerShare(shape, detail) {
  const parts = partsAt(shape, detail), one = (p) => ({ ...shape, parts: [p], damage_variants: null, parts_by_detail: null });
  let total = 0;
  POSE_HEADINGS.forEach((b) => {
    const a = (b * TAU) / 64, tris = [];
    parts.forEach((p, i) => projectShape(one(p), { heading: a, turret: a, detail }).forEach((t) => tris.push({ part: i, slot: t.slot, p: t.pts, d: t.pts.map((q) => (q[1] + q[2]) / 16) })));
    const r = auditRaster(tris, parts.length);
    total += r.owner / Math.max(r.drawn, 1);
  });
  return total / POSE_HEADINGS.length;
}
// Findings that are accepted or owned elsewhere; each prints as a KNOWN line with its source. Nothing is added without the user.
const DARK_TOPS = { 1: 1.86, 2: 1.09, 3: 2.07, 5: 1.65, 6: 1.21, 7: 1.13, 8: 2.53 }; // owner top on the dark ground, measured; a lower value fails
const KNOWN = [
  { re: /^contrast owner \d \w+ default on sand:/, source: 'design-answers-2026-11-08.md:653 (round 5, lifted default set): "No owner top reaches 3:1 against sand"; the side band carries the outline' },
  { re: /^contrast owner \d \w+ default in fog on sand:/, source: 'accepted (user, 2026-11-17): fog dims owner colour on purpose; the side band separates shapes' },
  { re: /^contrast owner (\d) \w+ default on dark ground: ([\d.]+)/, ok: (m) => +m[2] >= DARK_TOPS[m[1]], source: 'open: round 6 pick step owners_dark (user, 2026-11-17); Task 24 removes this entry' },
  { re: /^contrast cargo colour on sand: ([\d.]+)/, ok: (m) => +m[1] >= 2.44, source: 'open: round 6 pick step cargo (user, 2026-11-17); Task 24 removes this entry' },
  { re: /^china_rifle_infantry owner colour share at detail 2: ([\d.]+) %/, ok: (m) => +m[1] >= 21.2, source: 'design-answers-2026-11-08.md:686 records about 23 % against the 30 % floor; 21.2 % is the value measured on this page, a lower value is not known' },
];

function subjectsOf(shape) {
  const views = [['parts', shape.parts]];
  if (shape.parts_by_detail && shape.parts_by_detail[2]) views.push(['detail 2', shape.parts_by_detail[2]]);
  Object.entries(shape.damage_variants || {}).forEach(([v, d]) => views.push(['damage ' + v, d.parts]));
  return views.map(([tag, parts]) => ({ tag, shape: { ...shape, parts, has_turret: hasTurret(parts), damage_variants: null, parts_by_detail: null } }));
}
function runAuditChecks() {
  CUR = EXPORT_SEL; LEGACY = false; PAL = palFor(EXPORT_SEL.steps);
  const found = [];
  let checks = 0;
  const check = (ok, line) => { checks++; if (!ok) found.push(line); };
  const shapes = D.shapes.map((s) => exportShape(s.id)).concat(exportExtras().filter((e) => e.footprint));
  shapes.forEach((s) => subjectsOf(s).forEach(({ tag, shape }) => {
    const a = auditAny(shape);
    checks++;
    a.issues.forEach((issue) => found.push(`${s.id} ${tag}: ${issue}`));
  }));
  shapes.filter((s) => SHARE_FLOOR[s.role]).forEach((s) => [0, 2].forEach((d) => {
    const share = ownerShare({ ...s, damage_variants: null }, d);
    check(share >= SHARE_FLOOR[s.role], `${s.id} owner colour share at detail ${d}: ${(share * 100).toFixed(1)} % (floor ${SHARE_FLOOR[s.role] * 100} %)`);
  }));
  const grounds = [['sand', GROUND.sand], ['dark ground', GROUND.dark], ['HUD slab', SLAB]], fog = PAL.fog.factor;
  for (let o = 1; o <= 8; o++) {
    const top = slotsFor(o, 'default')[0];
    grounds.forEach(([name, g]) => check(contrast(top, g) >= 3, `contrast owner ${o} ${OWNER_NAME[o - 1]} default on ${name}: ${contrast(top, g).toFixed(2)} (bar 3)`));
    if (fog) check(contrast(scaleHex(top, fog), scaleHex(GROUND.sand, fog)) >= 3, `contrast owner ${o} ${OWNER_NAME[o - 1]} default in fog on sand: ${contrast(scaleHex(top, fog), scaleHex(GROUND.sand, fog)).toFixed(2)} (bar 3)`);
  }
  for (let a = 1; a <= 8; a++) for (let b = a + 1; b <= 8; b++) {
    const m = minDistance(slotsFor(a, 'default')[0], slotsFor(b, 'default')[0]);
    check(m >= 20, `colour vision owner ${a} ${OWNER_NAME[a - 1]} / ${b} ${OWNER_NAME[b - 1]} default: smallest dE ${m.toFixed(1)} (bar 20)`);
  }
  [['SIDE', PAL.band.side], ['SIDE_DARK', PAL.band.sideDark]].forEach(([band, hex]) => grounds.slice(0, 2).forEach(([name, g]) => check(contrast(hex, g) >= 3, `contrast band ${band} on ${name}: ${contrast(hex, g).toFixed(2)} (bar 3)`)));
  const cargo = cargoHex();
  if (cargo) [['sand', GROUND.sand], ['dark ground', GROUND.dark], ['pile base slab', PAL.band.sideDark], ['HUD slab', SLAB]].forEach(([name, g]) => check(contrast(cargo, g) >= 3, `contrast cargo colour on ${name}: ${contrast(cargo, g).toFixed(2)} (bar 3)`));
  // window.CAND6[step][option][id] = {parts}, added by the round 6 pick steps.
  Object.entries(window.CAND6 || {}).forEach(([step, options]) => Object.entries(options).forEach(([option, items]) => Object.entries(items || {}).forEach(([id, raw]) => {
    if (!raw || !Array.isArray(raw.parts)) return;
    const base = BASE[id] || EXTRA[id] || {};
    checks++;
    auditAny({ ...base, id, parts: raw.parts, has_turret: hasTurret(raw.parts), damage_variants: null, parts_by_detail: null }).issues.forEach((issue) => found.push(`CAND6 ${step}/${option}/${id}: ${issue}`));
  })));
  return { found, checks };
}
async function runAudit() {
  const lines = [];
  try {
    const { found, checks } = runAuditChecks();
    const isKnown = (line) => KNOWN.find((k) => { const m = k.re.exec(line); return m && (!k.ok || k.ok(m)); });
    const unexpected = found.filter((l) => !isKnown(l));
    found.filter(isKnown).forEach((l) => lines.push(`KNOWN ${l} | ${isKnown(l).source}`));
    unexpected.forEach((l) => lines.push('unexpected: ' + l));
    lines.push(unexpected.length ? `FAIL ${unexpected.length}` : `PASS ${checks} known ${found.length - unexpected.length}`);
  } catch (e) { lines.push('FAIL ' + (e && e.stack || e)); }
  await post('audit', lines.join('\n') + '\n');
}

<script>
'use strict';
const H = new URLSearchParams(location.hash.slice(1));
const WEIGHTS = [400, 600, 700, 800];
const NAME_RE = /^[a-z0-9-]+$/;

async function loadFonts() {
  if (H.get('font') === 'arial') FONT = 'Arial, sans-serif';
  if (H.get('font') === 'inter') {
    FONT = 'Inter, Arial, sans-serif';
    for (const [w, f] of [[400, 'Regular'], [600, 'SemiBold'], [700, 'Bold']]) {
      document.fonts.add(await new FontFace('Inter', `url(/build/map-art/proof-fonts/Inter-${f}.woff2)`, { weight: String(w) }).load());
    }
  }
  const loaded = await Promise.all(WEIGHTS.map((w) => document.fonts.load(`${w} 16px "Public Sans"`)));
  if (H.get('font') !== 'arial' && loaded.some((l) => !l.length)) throw new Error('Public Sans did not load for every weight: nothing is drawn');
}
async function post(name, text) {
  const r = await fetch('/report?name=' + encodeURIComponent(name), { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: text });
  if (r.status !== 204) addErr('report not recorded: HTTP ' + r.status);
}
const reports = {
  fonts() {
    const faces = [...document.fonts].filter((f) => f.family.replace(/"/g, '') === 'Public Sans' && f.status === 'loaded');
    const lines = WEIGHTS.map((w) => {
      const ok = document.fonts.check(`${w} 16px "Public Sans"`) && faces.some((f) => f.weight === String(w));
      return { w, ok, text: `${w} ${ok ? 'ok' : 'FAIL'}` };
    });
    const n = lines.filter((l) => l.ok).length;
    return lines.map((l) => l.text).concat(n === WEIGHTS.length ? 'PASS ' + n : 'FAIL ' + n).join('\n') + '\n';
  },
  pics: () => Object.keys(PICS).concat('PASS ' + Object.keys(PICS).length).join('\n') + '\n',
};
async function hudOptions() {
  if (!window.HUDV5) throw new Error('hud.js missing (' + MISSING.join(', ') + '): no HUD layer');
  const doc = await (await fetch('/docs/images/hud-v5/layout.json')).json();
  return Object.fromEntries(Object.entries(doc.meta.picks).map(([k, v]) => [k, v.value]));
}
function addHud(stage, o, state, scale) {
  const layer = document.createElement('div');
  layer.style.cssText = `position:absolute;left:0;top:0;width:1280px;height:720px;transform:scale(${scale});transform-origin:0 0`;
  layer.innerHTML = HUDV5.hud(o, { state, size: '1280x720', tier: H.get('tier') || 'full' });
  stage.appendChild(layer);
}
function drawPic(name, o) {
  const p = PICS[name], as = H.get('as') === 'shot' ? 'shot' : 'final', scale = H.get('scale') === '2' ? 2 : 1;
  document.body.className = 'shot'; app.className = 'shot';
  app.innerHTML = '';
  const stage = p.draw({ sel: p[as], scale });
  if (o) addHud(stage, o, H.get('hud'), scale);
  app.appendChild(stage);
  if (o) HUDV5.placeCards(stage);
}
async function start() {
  const [, hudOpts] = await Promise.all([loadFonts(), H.get('hud') ? hudOptions() : null]);
  const rep = H.get('report'), name = H.get('pic'), job = { export: runExport, roundtrip: runRoundtrip, audit: runAudit }[[...H.keys()].find((k) => ['export', 'roundtrip', 'audit'].includes(k))];
  if (job) await job();
  else if (rep) {
    if (!reports[rep]) throw new Error('unknown report ' + rep);
    const file = H.get('name') || rep;
    if (!NAME_RE.test(file)) throw new Error('bad report name ' + file);
    await post(file, reports[rep]());
  } else if (name && PICS[name]) drawPic(name, hudOpts);
  else app.innerHTML = '<h2>Map art pictures</h2><ul>' + Object.keys(PICS).map((n) => `<li><a href="#pic=${n}&as=shot">${n}</a></li>`).join('') + '</ul>';
}
start().catch((e) => addErr('start: ' + (e && e.stack || e)));
</script>
